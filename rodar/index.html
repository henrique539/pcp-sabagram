// === IMPRESSÃO DE RELATÓRIOS ===
window.imprimirRelatorio = function(tipo) {
  // tipo: "semana" ou "mes"
  var area = S.fcArea;
  var cor = CA[area];
  var nomeArea = CAL[area];
  var hoje = new Date();

  // Coletar dados
  var linhas = [];

  if (tipo === "semana") {
    // 7 dias a partir da semana base atual
    for (var i = 0; i < 7; i++) {
      var ds = toYMD(addD(S.fcSemBase, i));
      var d = fromYMD(ds);
      var u = isU(ds, area);
      var ch = chapasNoDia(area, ds);
      var cap = getCAP(area);
      var p = pct(ch, cap);
      var itens = (filas[area] || {})[ds] || [];
      linhas.push({ ds: ds, d: d, u: u, ch: ch, cap: cap, p: p, itens: itens });
    }
  } else {
    // Mês completo
    var ano = S.fcMesBase.getFullYear();
    var mes = S.fcMesBase.getMonth();
    var prim = new Date(ano, mes, 1);
    var ult = new Date(ano, mes + 1, 0);
    var dc = new Date(prim);
    while (dc <= ult) {
      var ds2 = toYMD(dc);
      var u2 = isU(ds2, area);
      var ch2 = chapasNoDia(area, ds2);
      var cap2 = getCAP(area);
      var p2 = pct(ch2, cap2);
      var itens2 = (filas[area] || {})[ds2] || [];
      linhas.push({ ds: ds2, d: new Date(dc), u: u2, ch: ch2, cap: cap2, p: p2, itens: itens2 });
      dc = addD(dc, 1);
    }
  }

  // Totais
  var totalCh = linhas.reduce(function(a, l) { return a + l.ch; }, 0);
  var diasAtivos = linhas.filter(function(l) { return l.u && l.ch > 0; }).length;
  var diasCapFull = linhas.filter(function(l) { return l.p >= 100; }).length;
  var diasCapAlta = linhas.filter(function(l) { return l.p >= 85 && l.p < 100; }).length;
  var mediaChDia = diasAtivos > 0 ? Math.round(totalCh / diasAtivos) : 0;

  // Montar HTML do relatório
  var tituloRel = tipo === "semana"
    ? "Relatório Semanal — " + nomeArea
    : "Relatório Mensal — " + nomeArea + " — " + MESES_L[S.fcMesBase.getMonth()] + "/" + S.fcMesBase.getFullYear();

  var periodoRel = tipo === "semana"
    ? fdFull(linhas[0].ds) + " a " + fdFull(linhas[linhas.length - 1].ds)
    : MESES_L[S.fcMesBase.getMonth()] + " de " + S.fcMesBase.getFullYear();

  var html = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'+
    '<title>' + tituloRel + '</title>'+
    '<style>'+
    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1a1a1a;margin:0;padding:20px;font-size:12px;}'+
    '.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:2px solid ' + cor + ';}'+
    '.logo{display:flex;align-items:center;gap:10px;}'+
    '.logo-box{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#378ADD,#7F77DD);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:700;}'+
    '.titulo{font-size:18px;font-weight:700;color:' + cor + ';}'+
    '.subtitulo{font-size:12px;color:#6b6a65;margin-top:2px;}'+
    '.meta{text-align:right;font-size:11px;color:#6b6a65;}'+
    '.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}'+
    '.kpi{border-radius:8px;padding:12px;border:.5px solid #e0dfd8;background:#f5f4ed;}'+
    '.kpi-val{font-size:26px;font-weight:700;margin:4px 0;}'+
    '.kpi-lbl{font-size:10px;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;}'+
    'table{width:100%;border-collapse:collapse;margin-bottom:20px;}'+
    'th{background:#f5f4ed;padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #e0dfd8;}'+
    'td{padding:7px 10px;border-bottom:.5px solid #e0dfd8;font-size:11px;vertical-align:top;}'+
    'tr.fds td{background:#f9f8f5;color:#9a9890;}'+
    'tr.hoje td{background:#E6F1FB20;}'+
    '.bar{height:6px;border-radius:99px;overflow:hidden;background:#e0dfd8;margin-top:3px;width:80px;}'+
    '.bar-fill{height:100%;border-radius:99px;}'+
    '.badge{border-radius:99px;padding:1px 7px;font-size:10px;font-weight:500;border:.5px solid;white-space:nowrap;display:inline-block;}'+
    '.bloco-chip{display:inline-block;background:' + cor + '15;color:' + cor + ';border:.5px solid ' + cor + '40;border-radius:4px;padding:1px 6px;font-size:10px;margin:1px;}'+
    '.footer{margin-top:20px;padding-top:12px;border-top:.5px solid #e0dfd8;display:flex;justify-content:space-between;font-size:10px;color:#9a9890;}'+
    '.sem-dados{color:#9a9890;font-style:italic;}'+
    '@media print{body{padding:10px;}@page{margin:15mm;}}'+
    '</style></head><body>';

  // Header
  html += '<div class="header"><div class="logo"><div class="logo-box">P</div><div>'+
    '<div class="titulo">' + tituloRel + '</div>'+
    '<div class="subtitulo">Per\xedodo: ' + periodoRel + '</div>'+
    '</div></div>'+
    '<div class="meta"><div>PCP Master</div><div>Emitido em: ' + hoje.toLocaleDateString("pt-BR") + ' \xe0s ' + hoje.toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit"}) + '</div></div></div>';

  // KPIs
  var corKpi1 = totalCh > 0 ? cor : "#888";
  html += '<div class="kpis">'+
    '<div class="kpi"><div class="kpi-lbl">Total de Chapas</div><div class="kpi-val" style="color:' + cor + ';">' + totalCh + '</div><div style="font-size:10px;color:#6b6a65;">chapas processadas</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">M\xe9dia/Dia Ativo</div><div class="kpi-val" style="color:' + cor + ';">' + mediaChDia + '</div><div style="font-size:10px;color:#6b6a65;">chapas/dia (dias com produ\xe7\xe3o)</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Dias Ativos</div><div class="kpi-val" style="color:#1a1a1a;">' + diasAtivos + '</div><div style="font-size:10px;color:#6b6a65;">de ' + linhas.filter(function(l){return l.u;}).length + ' dias \xfatteis</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Alertas de Capacidade</div><div class="kpi-val" style="color:' + (diasCapFull > 0 ? "#E24B4A" : diasCapAlta > 0 ? "#BA7517" : "#1D9E75") + ';">' + (diasCapFull + diasCapAlta) + '</div><div style="font-size:10px;color:#6b6a65;">' + diasCapFull + ' cheia(s), ' + diasCapAlta + ' alta(s)</div></div>'+
    '</div>';

  // Tabela por dia
  html += '<table><thead><tr>'+
    '<th style="width:110px;">Data</th>'+
    '<th style="width:70px;">Chapas</th>'+
    '<th style="width:90px;">Capacidade</th>'+
    '<th>Blocos / Etapas</th>'+
    '</tr></thead><tbody>';

  var hoje2 = toYMD(HOJE);
  linhas.forEach(function(l) {
    var isFds = l.d.getDay() === 0 || l.d.getDay() === 6;
    var isHoje2 = l.ds === hoje2;
    var corBar = l.p >= 100 ? "#E24B4A" : l.p >= 85 ? "#BA7517" : cor;
    var cls = isFds ? " class=\"fds\"" : isHoje2 ? " class=\"hoje\"" : "";
    var semDados = !l.u || l.ch === 0;

    html += '<tr' + cls + '>'+
      '<td><strong>' + DIAS_S[l.d.getDay()] + '</strong> ' + l.d.getDate() + '/' + pad(l.d.getMonth()+1) + '/' + l.d.getFullYear() +
        (isHoje2 ? ' <span class="badge" style="background:#E6F1FB;color:#185FA5;border-color:#85B7EB;font-size:9px;">Hoje</span>' : '') +
        (!l.u ? ' <span style="color:#9a9890;font-size:10px;">(n\xe3o \xfattil)</span>' : '') +
      '</td>'+
      '<td>' + (l.ch > 0 ? '<strong>' + l.ch + '</strong> ch' : '<span class="sem-dados">\u2014</span>') + '</td>'+
      '<td>' + (l.u ? l.p + '% <div class="bar"><div class="bar-fill" style="width:' + l.p + '%;background:' + corBar + ';"></div></div>' : '<span class="sem-dados">\u2014</span>') + '</td>'+
      '<td>';

    if (l.itens.length === 0) {
      html += '<span class="sem-dados">Sem etapas alocadas</span>';
    } else {
      l.itens.forEach(function(item) {
        var b = getB(item.bid);
        if (!b) return;
        var et = b.seq[item.eidx];
        var pl = fromYMD(et.pl);pl.setHours(0,0,0,0);
        var diff = Math.ceil((HOJE - pl)/(1000*3600*24));
        var atStatus = diff > 0 ? ' \u26a0 Atrasado ' + diff + 'd' : diff === 0 ? ' \ud83d\udd14 Hoje' : '';
        html += '<span class="bloco-chip">' + PRI_IC[b.pri] + ' #' + b.numero + ' \u2014 ' + et.n + ' (' + chapasTotal(b) + 'ch)' + atStatus + '</span> ';
      });
    }

    html += '</td></tr>';
  });

  html += '</tbody></table>';

  // Resumo por bloco (somente blocos com etapas no período)
  var blocosNoPeriodo = {};
  linhas.forEach(function(l) {
    l.itens.forEach(function(item) {
      if (!blocosNoPeriodo[item.bid]) blocosNoPeriodo[item.bid] = [];
      var b = getB(item.bid);
      if (b) blocosNoPeriodo[item.bid].push(b.seq[item.eidx].n);
    });
  });

  var bIds = Object.keys(blocosNoPeriodo);
  if (bIds.length > 0) {
    html += '<div style="font-size:11px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Blocos no per\xedodo (' + bIds.length + ')</div>'+
      '<table><thead><tr><th>Bloco</th><th>Material</th><th>Espessuras</th><th>Etapas no Per\xedodo</th><th>Prioridade</th></tr></thead><tbody>';
    bIds.forEach(function(bid) {
      var b = getB(Number(bid));
      if (!b) return;
      var prog = pct(b.seq.filter(function(e){return e.ok;}).length, b.seq.length);
      var stC = ST[statusBloco(b)] || ST.fila;
      html += '<tr>'+
        '<td><strong>#' + b.numero + '</strong><br><span style="font-size:10px;color:' + stC.cor + ';">' + stC.tx + '</span></td>'+
        '<td>' + b.mat + '</td>'+
        '<td>' + (b.chapas2cm ? b.chapas2cm + 'ch 2cm<br>' : '') + (b.chapas3cm ? b.chapas3cm + 'ch 3cm' : '') + '</td>'+
        '<td>' + blocosNoPeriodo[bid].map(function(n){return'<span class="bloco-chip">'+n+'</span>';}).join(' ') + '</td>'+
        '<td>' + PRI_IC[b.pri] + ' ' + b.pri + '</td>'+
      '</tr>';
    });
    html += '</tbody></table>';
  }

  // Footer
  html += '<div class="footer"><div>PCP Master v2.0 \u2014 PCP Master</div><div>Relat\xf3rio gerado em ' + hoje.toLocaleDateString("pt-BR") + '</div></div>';
  html += '</body></html>';

  // Abrir janela de impressão
  var win = window.open('', '_blank');
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(function() { win.print(); }, 500);
};

// === FIREBASE — carregamento dinâmico ===
var FB_URL = "https://pcp-sabagram-default-rtdb.firebaseio.com";
var FB_READY = false;
var FB_SAVING = false;
var FB_DIRTY = false;

function showToast(msg) {
  var t = document.getElementById('fb-toast');
  if (!t) { t = document.createElement('div'); t.id = 'fb-toast'; t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1D9E75;color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:9999;transition:opacity .3s;'; document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t); t._t = setTimeout(function() { t.style.opacity = '0'; }, 2500);
}

function fbSave() {
  if (!FB_READY) return;
  if (FB_SAVING) { FB_DIRTY = true; return; }
  FB_SAVING = true;
  FB_DIRTY = false;
  fetch(FB_URL + '/pcp.json', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({blocos: BLOCOS, config: CONFIG, estoque: ESTOQUE, compras: COMPRAS, serrada: FILA_SERRADA, historico: HISTORICO, filaOrdem: FILA_ORDEM, paradas: PARADAS, ts: Date.now()})
  }).then(function(r) {
    FB_SAVING = false;
    if (r.ok) {
      showToast('💾 Salvo');
      if (FB_DIRTY) fbSave();
    } else {
      showToast('⚠️ Erro ao salvar — tentando novamente...');
      FB_DIRTY = true;
      setTimeout(fbSave, 2000);
    }
  }).catch(function(e) {
    FB_SAVING = false;
    showToast('⚠️ Falha de rede — tentando novamente...');
    FB_DIRTY = true;
    setTimeout(fbSave, 3000);
  });
}

function fixArr(v) {
  if (!v) return [];
  if (Array.isArray(v)) return v;
  return Object.keys(v).sort(function(a,b){return+a-+b;}).map(function(k){return v[k];});
}

document.addEventListener('click', function(e) {
  var t = e.target;

  // Botão Editar bloco
  var btnEdit = t && t.closest ? t.closest('[data-editid]') : null;
  if (btnEdit && btnEdit.dataset && btnEdit.dataset.editid) {
    var bid = Number(btnEdit.dataset.editid);
    S.bEditId = S.bEditId === bid ? null : bid;
    render(); return;
  }

  // Sequência do BLOCO: mover
  var btnMv = t && t.closest ? t.closest('[data-seq-mv]') : null;
  if (btnMv) {
    var pfx=btnMv.dataset.pfx, i=Number(btnMv.dataset.i), dir=Number(btnMv.dataset.dir);
    if(pfx==="novo"){mvSeqNovo(i,dir);}else{mvSeqBloco(Number(pfx),i,dir);}
    return;
  }
  // Sequência do BLOCO: remover
  var btnRem = t && t.closest ? t.closest('[data-seq-rem]') : null;
  if (btnRem) {
    var pfx=btnRem.dataset.pfx, i=Number(btnRem.dataset.i);
    if(pfx==="novo"){remSeqNovo(i);}else{remSeqBloco(Number(pfx),i);}
    return;
  }
  // Sequência do BLOCO: adicionar etapa
  var btnAdd = t && t.closest ? t.closest('[data-seq-add]') : null;
  if (btnAdd) {
    var pfx=btnAdd.dataset.pfx, et=btnAdd.dataset.et;
    if(pfx==="novo"){addSeqNovo(et);}else{addSeqBloco(Number(pfx),et);}
    return;
  }

  // Sequência do MATERIAL: mover
  var btnMatMv = t && t.closest ? t.closest('[data-mat-mv]') : null;
  if (btnMatMv) { mvSeqMat(btnMatMv.dataset.mid,btnMatMv.dataset.i,btnMatMv.dataset.dir); return; }
  // Sequência do MATERIAL: remover
  var btnMatRem = t && t.closest ? t.closest('[data-mat-rem]') : null;
  if (btnMatRem) { remSeqMat(btnMatRem.dataset.mid,btnMatRem.dataset.i); return; }
  // Sequência do MATERIAL: adicionar etapa
  var btnMatAdd = t && t.closest ? t.closest('[data-mat-add]') : null;
  if (btnMatAdd) { addSeqMat(btnMatAdd.dataset.mid,btnMatAdd.dataset.et); return; }

  // Remover apontamento do histórico
  var btnRemAp = t && t.closest ? t.closest('[data-rem-ap]') : null;
  if (btnRemAp) {
    var bid=Number(btnRemAp.dataset.bid), eidx=Number(btnRemAp.dataset.eidx), hi=Number(btnRemAp.dataset.hi);
    if(confirm('Remover este apontamento?')) { remApHist(bid,eidx,hi); }
    return;
  }

  if (t && t.id === 'btn-fc-sem') { S.fcModo = 'semanal'; render(); }
  if (t && t.id === 'btn-fc-men') { S.fcModo = 'mensal'; render(); }
});

function initFirebase() {
  var el = document.getElementById('root');
  if (el) el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:400px;flex-direction:column;gap:12px;color:#6b6a65;"><div style="font-size:32px">⌛</div><div style="font-size:14px;font-weight:500">Carregando dados...</div></div>';
  fetch(FB_URL + '/pcp.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && !data.error) {
        if (data.blocos) {
          var bl = Array.isArray(data.blocos) ? data.blocos :
            Object.keys(data.blocos).sort(function(a,b){return+a-+b;}).map(function(k){return data.blocos[k];});
          if (bl.length > 0) {
            BLOCOS = bl.map(function(b) {
              if (!b) return null;
              if (!b.seq) b.seq = [];
              if (b.seq && !Array.isArray(b.seq)) {
                b.seq = fixArr(b.seq).map(function(s){ if(s&&s.hist&&!Array.isArray(s.hist))s.hist=fixArr(s.hist); return s; });
              } else if (b.seq) {
                b.seq.forEach(function(s){ if(s&&s.hist&&!Array.isArray(s.hist))s.hist=fixArr(s.hist); });
              }
              return b;
            }).filter(Boolean);
          }
        }
        if (data.config) {
          if (data.config.mercados) { CONFIG.mercados = fixArr(data.config.mercados); }
          if (data.historico) { HISTORICO = fixArr(data.historico); }
          if (data.filaOrdem) { FILA_ORDEM = data.filaOrdem; }
        if (data.paradas) { PARADAS = data.paradas; }
          if (data.config.materiais) { CONFIG.materiais = fixArr(data.config.materiais); CONFIG.materiais.forEach(function(m){ m.eR=fixArr(m.eR); m.eP=fixArr(m.eP); m.eT=fixArr(m.eT||[]); }); }
          if (data.config.resina) { CONFIG.resina = Object.assign({}, CONFIG.resina, data.config.resina); CONFIG.resina.diasAtivos=fixArr(data.config.resina.diasAtivos); CONFIG.resina.etapas=fixArr(data.config.resina.etapas); }
          if (data.config.politriz) { CONFIG.politriz = Object.assign({}, CONFIG.politriz, data.config.politriz); CONFIG.politriz.diasAtivos=fixArr(data.config.politriz.diasAtivos); CONFIG.politriz.etapas=fixArr(data.config.politriz.etapas); }
          if (data.config.tratamento) { CONFIG.tratamento = Object.assign({}, CONFIG.tratamento, data.config.tratamento); CONFIG.tratamento.diasAtivos=fixArr(data.config.tratamento.diasAtivos); CONFIG.tratamento.tanques=fixArr(data.config.tratamento.tanques); }
        }
        if(data.estoque){ESTOQUE=Array.isArray(data.estoque)?data.estoque:Object.keys(data.estoque).map(function(k){return data.estoque[k];}).filter(Boolean);}
        if(data.compras){COMPRAS=Array.isArray(data.compras)?data.compras:Object.keys(data.compras).map(function(k){return data.compras[k];}).filter(Boolean);}
        if(data.serrada){FILA_SERRADA=Array.isArray(data.serrada)?data.serrada:Object.keys(data.serrada).map(function(k){return data.serrada[k];}).filter(Boolean);}
        showToast('✅ Dados carregados');
      } else {
        showToast('🚀 Inicializando banco...');
        FB_READY = true; fbSave();
      }
      FB_READY = true; initFilas(); if(_AUTH_READY) render();
    })
    .catch(function(e) {
      console.error('Firebase REST erro:', e);
      showToast('⚠️ Modo offline — dados não salvos');
      // FB_READY permanece false: nunca salva no offline para não sobrescrever o banco
      FB_READY = false; if(_AUTH_READY) render();
    });
}

// Bloqueia o sistema imediatamente — mostra loading até auth resolver
(function() {
  var el = document.getElementById('root');
  if (el) el.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0efe8;"><div style="text-align:center;color:#6b6a65;"><div style="font-size:32px;margin-bottom:10px;">🏭</div><div style="font-size:14px;font-weight:500;">PCP Master</div><div style="font-size:11px;margin-top:4px;">Verificando acesso...</div></div></div>';
})();

var FB_APP = firebase.initializeApp({
  apiKey: "AIzaSyCqeFTo8zcxgQ80Bji2NJ_Bbut0EPYSC4c",
  authDomain: "pcp-sabagram.firebaseapp.com",
  projectId: "pcp-sabagram"
});
var FB_AUTH = firebase.auth();
var USUARIO_ATUAL = null; // {uid, email, nome}

var NOMES_USUARIOS = {
  'henrique@sabagram.com.br': 'Henrique',
  'producao@sabagram.com.br': 'Glaydson',
  'fernando@sabagram.com.br': 'Fernando'
};

function getNomeUsuario(email) {
  return NOMES_USUARIOS[email] || (email ? email.split('@')[0] : 'Usuário');
}

function renderLogin(erro) {
  document.getElementById('root').innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0efe8;">' +
    '<div style="background:#fff;border-radius:14px;padding:32px 28px;width:320px;border:.5px solid #e0dfd8;box-shadow:0 4px 24px rgba(0,0,0,.08);">' +
      '<div style="text-align:center;margin-bottom:24px;">' +
        '<div style="font-size:28px;margin-bottom:6px;">🏭</div>' +
        '<div style="font-size:18px;font-weight:700;color:#1a1a1a;">PCP Master</div>' +
        '<div style="font-size:11px;color:#9a9890;margin-top:2px;">Sabagram · Granitos e Mármores</div>' +
      '</div>' +
      (erro ? '<div style="background:#FCEBEB;border:.5px solid #F09595;border-radius:7px;padding:8px 12px;font-size:11px;color:#A32D2D;margin-bottom:14px;">⚠️ ' + erro + '</div>' : '') +
      '<div style="margin-bottom:10px;">' +
        '<div style="font-size:10px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">E-mail</div>' +
        '<input id="login-email" type="email" placeholder="seu@sabagram.com.br" style="width:100%;padding:8px 10px;font-size:13px;border-radius:7px;border:.5px solid #c8c7c0;outline:none;" onkeydown="if(event.key===\'Enter\')document.getElementById(\'login-senha\').focus()">' +
      '</div>' +
      '<div style="margin-bottom:18px;">' +
        '<div style="font-size:10px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Senha</div>' +
        '<input id="login-senha" type="password" placeholder="••••••••" style="width:100%;padding:8px 10px;font-size:13px;border-radius:7px;border:.5px solid #c8c7c0;outline:none;" onkeydown="if(event.key===\'Enter\')fazerLogin()">' +
      '</div>' +
      '<button onclick="fazerLogin()" style="width:100%;padding:10px;background:#0F1B35;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;">Entrar</button>' +
    '</div></div>';
  setTimeout(function(){ var el=document.getElementById('login-email'); if(el) el.focus(); }, 100);
}

window.fazerLogin = function() {
  var email = (document.getElementById('login-email').value || '').trim();
  var senha = document.getElementById('login-senha').value || '';
  if (!email || !senha) { renderLogin('Preencha e-mail e senha.'); return; }
  var btn = document.querySelector('button[onclick="fazerLogin()"]');
  if (btn) { btn.textContent = 'Entrando...'; btn.disabled = true; }
  FB_AUTH.signInWithEmailAndPassword(email, senha)
    .catch(function(e) {
      var msg = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential'
        ? 'E-mail ou senha incorretos.' : 'Erro ao entrar. Tente novamente.';
      renderLogin(msg);
    });
};

window.fazerLogout = function() {
  if (!confirm('Sair do PCP Master?')) return;
  FB_AUTH.signOut();
};

// Observador de autenticação — controla tudo
FB_AUTH.onAuthStateChanged(function(user) {
  if (user) {
    USUARIO_ATUAL = { uid: user.uid, email: user.email, nome: getNomeUsuario(user.email) };
    _AUTH_READY = true;
    initFirebase();
  } else {
    USUARIO_ATUAL = null;
    FB_READY = false;
    _AUTH_READY = false;
    renderLogin();
  }
});

window.addEventListener('beforeunload', function() {
  if (!FB_READY || BLOCOS.length === 0) return;
  fetch(FB_URL + '/pcp.json', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({blocos: BLOCOS, config: CONFIG, estoque: ESTOQUE, compras: COMPRAS, serrada: FILA_SERRADA, historico: HISTORICO, filaOrdem: FILA_ORDEM, paradas: PARADAS, ts: Date.now()}),
    keepalive: true
  });
});

</script>
</body>
</html>
