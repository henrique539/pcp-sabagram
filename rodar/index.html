<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCP Master</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0efe8;color:#1a1a1a;display:flex;justify-content:center;padding:0;min-height:100vh;margin:0;}
#app{width:100%;max-width:100%;background:#fff;border-radius:0;box-shadow:none;overflow:hidden;min-height:100vh;}
input,select{font-family:inherit;font-size:12px;color:#1a1a1a;background:#fff;border:.5px solid #c8c7c0;border-radius:6px;padding:6px 9px;outline:none;width:100%}
input:focus,select:focus{border-color:#378ADD}
button{font-family:inherit;cursor:pointer;border-radius:6px;border:.5px solid #c8c7c0;background:#fff;color:#1a1a1a;padding:5px 10px;font-size:12px}
button:hover{background:#f0efe8}
button:disabled{opacity:.25;cursor:default}
.layout{display:flex;min-height:100vh}
.sidebar{width:192px;flex-shrink:0;background:#f5f4ed;border-right:.5px solid #e0dfd8;display:flex;flex-direction:column}
.logo-area{padding:16px 14px 12px}
.nav-group{padding:6px 14px 2px;font-size:9px;font-weight:700;color:#9a9890;text-transform:uppercase;letter-spacing:1px}
.nav-sep{height:.5px;background:#e0dfd8;margin:4px 0}
.nav-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;cursor:pointer;border:none;background:transparent;color:#6b6a65;width:100%;text-align:left;position:relative;font-family:inherit}
.nav-btn:hover{background:#fff;color:#1a1a1a}
.nav-ativo{color:#1a1a1a;font-weight:500;background:#fff}
.nav-ativo::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:0 3px 3px 0;background:#378ADD}
.nav-footer{margin-top:auto;padding:10px 14px;border-top:.5px solid #e0dfd8;font-size:10px;color:#9a9890}
.content{flex:1;overflow:auto;background:#fff}
.ci{padding:16px 18px}
.lbl{font-size:10px;color:#6b6a65;font-weight:500;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px}
.badge{border-radius:99px;padding:2px 8px;font-size:10px;font-weight:500;border:.5px solid;white-space:nowrap;display:inline-block}
.card{background:#f5f4ed;border:.5px solid #e0dfd8;border-radius:9px;padding:12px 14px;margin-bottom:8px}
.prog-bar{height:5px;border-radius:99px;overflow:hidden;background:#e0dfd8}
.prog-fill{height:100%;border-radius:99px}
.cap-bar{height:7px;border-radius:99px;overflow:hidden;background:#e0dfd8}
.cap-fill{height:100%;border-radius:99px}
.tab-row{display:flex;gap:3px;background:#f0efe8;border-radius:8px;padding:3px;margin-bottom:8px}
.tab-b{padding:5px 10px;font-size:11px;border-radius:6px;border:none;background:transparent;color:#6b6a65;cursor:pointer;flex:1;font-family:inherit}
.tab-b.on{background:#fff;color:#1a1a1a;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;border:.5px solid #e0dfd8;margin-bottom:4px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:500;cursor:pointer;border:.5px solid;margin:2px}
.mv-btn{width:24px;height:24px;padding:0;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0}
.step-row{border-radius:7px;padding:7px 10px;margin-bottom:3px;border:.5px solid;display:flex;align-items:center;gap:7px}
.etapa-card{border-radius:8px;padding:10px 12px;margin-bottom:5px;border:.5px solid #e0dfd8}
.hist-item{padding:5px 9px;border-radius:6px;background:#f5f4ed;margin-bottom:3px;display:flex;align-items:center;gap:6px;font-size:11px}
.cal-cell{min-height:64px;border-radius:6px;border:.5px solid #e0dfd8;padding:4px;background:#fff;cursor:pointer}
.cal-cell:hover{border-color:#b0afa8}
.ev-mini{border-radius:3px;padding:2px 4px;margin-bottom:1px;font-size:9px;border-left:2px solid;line-height:1.3}
.rmv-btn{color:#A32D2D;border-color:#F09595;padding:3px 8px;font-size:11px}
.pop{position:fixed;z-index:999;background:#fff;border:.5px solid #c8c7c0;border-radius:12px;padding:14px 16px;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:12px;padding:18px 20px;width:340px;border:.5px solid #c8c7c0;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.sec-title{font-size:11px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:.5px solid #e0dfd8}
.section-title{font-size:10px;font-weight:600;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.cap-destaque{border-radius:10px;padding:16px;border:2px solid}
.info-box{background:#f5f4ed;border-radius:7px;padding:8px 12px;font-size:11px;color:#6b6a65;border:.5px solid #e0dfd8}
.toggle-box{width:36px;height:20px;border-radius:99px;border:.5px solid #c8c7c0;display:flex;align-items:center;padding:2px;transition:all .2s;flex-shrink:0}
.toggle-dot{width:14px;height:14px;border-radius:50%;background:#9a9890;transition:all .2s}
.toggle-on .toggle-box{background:#378ADD;border-color:#378ADD}
.toggle-on .toggle-dot{background:#fff;transform:translateX(16px)}
</style>
</head>
<body>
<div id="app">
  <div id="root"></div>
  <div id="pop" class="pop" style="display:none;"></div>
  <div id="modal-bg" style="display:none;"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script>
// BLOQUEIO IMEDIATO — nada roda antes do auth resolver
document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0efe8;"><div style="text-align:center;color:#6b6a65;"><div style="font-size:32px;margin-bottom:10px;">🏭</div><div style="font-size:14px;font-weight:500;color:#1a1a1a;">PCP Master</div><div style="font-size:11px;margin-top:4px;">Verificando acesso...</div></div></div>';
var _AUTH_READY = false;

// === PCP MASTER v2.0 — PCP Master ===
var CA={resina:"#378ADD",politriz:"#7F77DD",tratamento:"#1D9E75"};
var CAL={resina:"Resina",politriz:"Politriz",tratamento:"Tratamento"};
var CAP={resina:117,politriz:90,tratamento:180};
// CAP dinâmico - atualizado após carregar CONFIG do Firebase
function getCAP(area){
  if(area==="resina")return CONFIG.resina&&CONFIG.resina.capacidadeDia?Number(CONFIG.resina.capacidadeDia):117;
  if(area==="politriz")return CONFIG.politriz&&CONFIG.politriz.capacidadeDia?Number(CONFIG.politriz.capacidadeDia):90;
  if(area==="tratamento")return CONFIG.tratamento&&CONFIG.tratamento.capacidadeDia?Number(CONFIG.tratamento.capacidadeDia):180;
  return 999;
}
var HORAS={resina:9,politriz:9,tratamento:24};
var DU={resina:[1,2,3,4,5],politriz:[1,2,3,4,5],tratamento:[0,1,2,3,4,5,6]};
function getDiasUteis(area){
  if(area==="resina")return CONFIG.resina&&CONFIG.resina.diasAtivos&&CONFIG.resina.diasAtivos.length?CONFIG.resina.diasAtivos:[1,2,3,4,5];
  if(area==="politriz")return CONFIG.politriz&&CONFIG.politriz.diasAtivos&&CONFIG.politriz.diasAtivos.length?CONFIG.politriz.diasAtivos:[1,2,3,4,5];
  if(area==="tratamento")return CONFIG.tratamento&&CONFIG.tratamento.diasAtivos&&CONFIG.tratamento.diasAtivos.length?CONFIG.tratamento.diasAtivos:[0,1,2,3,4,5,6];
  return [0,1,2,3,4,5,6];
}
var PRI_IC={urgente:"\uD83D\uDD34",prioridade:"\uD83D\uDFE1",normal:"\uD83D\uDFE2"};
var PRI_ORD={urgente:0,prioridade:1,normal:2};
var HOJE=new Date();HOJE.setHours(0,0,0,0);
var DIAS_S=["Dom","Seg","Ter","Qua","Qui","Sex","S\u00e1b"];
var MESES_L=["Janeiro","Fevereiro","Mar\u00e7o","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var CC_MAT={0:"#888780",1:"#378ADD",2:"#1D9E75",3:"#639922",4:"#BA7517",5:"#D85A30",6:"#E24B4A"};
var ET_RESINA=["Tela","Manta","1\u00aa Resina","2\u00aa Resina","3\u00aa Resina","Impermeabiliza\u00e7\u00e3o","Pintar"];
var ET_POLITRIZ=["Levigar 1","Levigar 2","Levigar 3","Lustrar","Polir","Escovar","Polir Resinado"];
var ET_TRAT=["Tanque Aquecido","Neutraliza\u00e7\u00e3o","Tanque Frio"];

// Getter dinâmico: sempre reflete etapas cadastradas no CONFIG
function getEtResina(){ return CONFIG.resina&&CONFIG.resina.etapas&&CONFIG.resina.etapas.length?CONFIG.resina.etapas.map(function(e){return e.nome;}):ET_RESINA; }
function getEtPolitriz(){ return CONFIG.politriz&&CONFIG.politriz.etapas&&CONFIG.politriz.etapas.length?CONFIG.politriz.etapas.map(function(e){return e.nome;}):ET_POLITRIZ; }
function getEtTrat(){ return CONFIG.tratamento&&CONFIG.tratamento.tanques&&CONFIG.tratamento.tanques.length?CONFIG.tratamento.tanques.map(function(e){return e.nome;}):ET_TRAT; }
var ESP_ET={"1\u00aa Resina":12,"2\u00aa Resina":12,"3\u00aa Resina":12,"Impermeabiliza\u00e7\u00e3o":8,"Pintar":4,"Polir Resinado":2,"Tanque Aquecido":2,"Neutraliza\u00e7\u00e3o":1,"Tanque Frio":1};

// Busca espH de uma etapa no CONFIG dinâmico (prioridade) ou ESP_ET (fallback)
function getEspH(nomeEt){
  var todas=[].concat(CONFIG.resina&&CONFIG.resina.etapas||[],CONFIG.politriz&&CONFIG.politriz.etapas||[],CONFIG.tratamento&&CONFIG.tratamento.tanques||[]);
  // Busca exata primeiro
  var et=todas.find(function(e){return e.nome===nomeEt;});
  if(et&&et.espH!=null)return Number(et.espH)||0;
  // Busca no ESP_ET exato
  if(ESP_ET[nomeEt])return ESP_ET[nomeEt];
  // Busca parcial: "Resina" encontra "1ª Resina", "Levigar" encontra "Levigar 1" etc.
  var nLow=nomeEt.toLowerCase();
  var etParcial=todas.find(function(e){
    return e.nome&&(e.nome.toLowerCase().indexOf(nLow)>=0||nLow.indexOf(e.nome.toLowerCase())>=0);
  });
  if(etParcial&&etParcial.espH!=null)return Number(etParcial.espH)||0;
  // Busca parcial no ESP_ET
  var keys=Object.keys(ESP_ET);
  for(var i=0;i<keys.length;i++){
    var kLow=keys[i].toLowerCase();
    if(kLow.indexOf(nLow)>=0||nLow.indexOf(kLow)>=0)return ESP_ET[keys[i]];
  }
  return 0;
}
// Retorna total de horas que um bloco fica "bloqueado" após entrar numa etapa
// Para tanques de tratamento: duracaoH + espH (o bloco fica no tanque pelo duracaoH, depois espera espH)
// Para etapas de resina/politriz: só espH (processamento é intra-dia, só a espera pós-etapa conta)
function getTotalHAnt(nomeEt){
  var tanques=CONFIG.tratamento&&CONFIG.tratamento.tanques||[];
  var tk=tanques.find(function(e){return e.nome===nomeEt;});
  if(tk){
    var dur=tk.duracaoH!=null?Number(tk.duracaoH):
            tk.duracaoMaxH!=null?Number(tk.duracaoMaxH):0;
    var esp=Number(tk.espH)||0;
    return dur+esp;
  }
  return getEspH(nomeEt);
}
// Busca obs de uma etapa no CONFIG dinâmico
function getObsEt(nomeEt){
  var todas=[].concat(CONFIG.resina&&CONFIG.resina.etapas||[],CONFIG.politriz&&CONFIG.politriz.etapas||[],CONFIG.tratamento&&CONFIG.tratamento.tanques||[]);
  var et=todas.find(function(e){return e.nome===nomeEt;});
  return et&&et.obs?et.obs:'';
}
var ST={
  em_processamento:{ic:"\u2699\uFE0F",tx:"Em produ\u00e7\u00e3o",cor:"#378ADD",bg:"#E6F1FB",br:"#85B7EB"},
  fila:{ic:"\uD83D\uDCCB",tx:"Na fila",cor:"#BA7517",bg:"#FAEEDA",br:"#FAC775"},
  pausado:{ic:"\u23F8",tx:"Pausado",cor:"#888780",bg:"#F1EFE8",br:"#B4B2A9"},
  concluido:{ic:"\u2705",tx:"Conclu\u00eddo",cor:"#1D9E75",bg:"#E1F5EE",br:"#5DCAA5"},
  atrasado:{ic:"\u26A0\uFE0F",tx:"Atrasado",cor:"#E24B4A",bg:"#FCEBEB",br:"#F09595"},
};
var HISTORICO_MED={"BIANCO SUPERIORE":[22,24,21,23],"BLACK STORM":[18,20,19],"VERDE UBATUBA":[14,15,13,16],"HIMALAYA":[10,11,10],"PERLA VENATA":[21,23,22],"BRANCO PARANA":[10,11],"MYSTIC":[12,13]};

function ga(n){
  // Verificar dinâmico primeiro
  if(CONFIG.resina&&CONFIG.resina.etapas&&CONFIG.resina.etapas.some(function(e){return e.nome===n;}))return"resina";
  if(CONFIG.politriz&&CONFIG.politriz.etapas&&CONFIG.politriz.etapas.some(function(e){return e.nome===n;}))return"politriz";
  if(CONFIG.tratamento&&CONFIG.tratamento.tanques&&CONFIG.tratamento.tanques.some(function(e){return e.nome===n;}))return"tratamento";
  if(["Tela","Manta","1\u00aa Resina","2\u00aa Resina","3\u00aa Resina","Impermeabiliza\u00e7\u00e3o","Pintar"].indexOf(n)>=0)return"resina";
  if(["Levigar 1","Levigar 2","Levigar 3","Lustrar","Polir","Escovar","Polir Resinado"].indexOf(n)>=0)return"politriz";
  return"tratamento";
}
function toYMD(d){return d.toISOString().slice(0,10);}
function fromYMD(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fd(d){return d?new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"\u2014";}
function fdFull(d){return d?new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}):"\u2014";}
function fdL(s){try{return new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});}catch(e){return fd(s);}}
function fdw(d){return DIAS_S[new Date(d).getDay()];}
function pad(n){return n<10?"0"+n:""+n;}
function pct(v,t){if(!t)return 0;return Math.min(100,Math.round(v/t*100));}
function corC(p){return p>=100?"#E24B4A":p>=85?"#BA7517":"#1D9E75";}
function isU(ds,a){var du=getDiasUteis(a);return du&&du.indexOf(fromYMD(ds).getDay())>=0;}
function proxU(ds,a){var d=fromYMD(ds);var du=getDiasUteis(a);for(var i=0;i<14;i++){if(du.indexOf(d.getDay())>=0)return toYMD(d);d=addD(d,1);}return ds;}
function mediaMat(mat){var h=HISTORICO_MED[mat];if(!h||!h.length)return null;return Math.round(h.reduce(function(a,b){return a+b;},0)/h.length);}
function getB(id){return BLOCOS.find(function(b){return b.id===Number(id);});}
function chapasTotal(b){return(b.chapas2cm||0)+(b.chapas3cm||0);}

// Retorna nome da etapa com sufixo de repetição se necessário
// ex: "Levigar" aparece 3x → "Levigar (1ª)", "Levigar (2ª)", "Levigar (3ª)"
var ORD_SUF=["º","º","º","º","º","º","º","º","º","º"];
function etLabel(b,eidx){
  if(!b||!b.seq)return"";
  var nome=b.seq[eidx].n;
  // Contar quantas vezes esse nome aparece na sequência
  var ocorrencias=b.seq.filter(function(e){return e.n===nome;});
  if(ocorrencias.length<=1)return nome; // só aparece uma vez, sem sufixo
  // Descobrir qual ocorrência é esta
  var vez=0;
  for(var i=0;i<=eidx;i++){
    if(b.seq[i].n===nome)vez++;
  }
  // Sufixo ordinal
  var suf=vez===1?"1ª":vez===2?"2ª":vez===3?"3ª":(vez+"ª");
  return nome+" <span style='font-size:9px;opacity:.7;'>("+suf+")</span>";
}
// Versão texto puro (sem HTML) para uso em títulos/tooltips
function etLabelTxt(b,eidx){
  if(!b||!b.seq)return"";
  var nome=b.seq[eidx].n;
  var ocorrencias=b.seq.filter(function(e){return e.n===nome;});
  if(ocorrencias.length<=1)return nome;
  var vez=0;
  for(var i=0;i<=eidx;i++){if(b.seq[i].n===nome)vez++;}
  var suf=vez===1?"1ª":vez===2?"2ª":vez===3?"3ª":(vez+"ª");
  return nome+" ("+suf+")";
}
function etapaAtiva(b){if(!b||!b.seq)return -1;for(var i=0;i<b.seq.length;i++){if(!b.seq[i].ok)return i;}return -1;}
function statusBloco(b){
  if(!b||!b.seq)return"fila";
  if(b.status==="concluido")return"concluido";
  if(b.status==="pausado")return"pausado";
  var idx=etapaAtiva(b);
  if(idx>=0){var pl=fromYMD(b.seq[idx].pl);pl.setHours(0,0,0,0);if(pl<HOJE)return"atrasado";}
  return b.status;
}
function prevStatus(prev){
  if(!prev)return null;
  var d=fromYMD(prev);d.setHours(0,0,0,0);
  var diff=Math.ceil((d-HOJE)/(1000*3600*24));
  if(diff<0)return{cor:"#E24B4A",tx:"Atrasado "+Math.abs(diff)+"d"};
  if(diff===0)return{cor:"#BA7517",tx:"Hoje"};
  if(diff<=5)return{cor:"#BA7517",tx:"Em "+diff+"d"};
  return{cor:"#1D9E75",tx:fdw(prev)+" "+fd(prev)};
}
function toggleHtml(fn,val){
  return'<div class="toggle'+(val?" toggle-on":"")+'" onclick="'+fn+'" style="display:flex;align-items:center;gap:8px;cursor:pointer;"><div class="toggle-box"><div class="toggle-dot"></div></div><span style="font-size:12px;color:'+(val?"#1D9E75":"#9a9890")+';font-weight:'+(val?"500":"400")+'">'+(val?"Sim":"N\u00e3o")+"</span></div>";
}
function diasBtns(ativos,fn,cor){
  return DIAS_S.map(function(d,i){var on=ativos.indexOf(i)>=0;
    return'<button onclick="'+fn+'('+i+')" style="padding:5px 10px;font-size:11px;border-radius:6px;font-weight:'+(on?"600":"400")+';background:'+(on?cor+"18":"#f5f4ed")+';color:'+(on?cor:"#6b6a65")+';border-color:'+(on?cor+"50":"#e0dfd8")+';">'+d+"</button>";
  }).join("");
}
function chipsMat(arr,lista,fnBase,cor,mid,area){
  return lista.map(function(e){
    // Busca robusta: normaliza encoding e compara
    var eN=e.normalize?e.normalize():"";
    var on=arr.some(function(a){return a===e||(a.normalize&&a.normalize()===eN);});
    if(mid!==undefined&&area!==undefined){
      return'<button class="chip" onclick="event.stopPropagation();toggleEtMat('+mid+',\''+area+'\',\''+e+'\')" style="background:'+(on?cor+"18":"#f5f4ed")+';color:'+(on?cor:"#6b6a65")+';border-color:'+(on?cor+"50":"#e0dfd8")+';">'+e+'</button>';
    }
    return'<button class="chip" onclick="event.stopPropagation();'+fnBase+"'"+e+"')"+" style=\"background:"+(on?cor+"18":"#f5f4ed")+";color:"+(on?cor:"#6b6a65")+";border-color:"+(on?cor+"50":"#e0dfd8")+";\">"+e+"</button>";
  }).join("");
}

// === DADOS ===
var CONFIG={
  materiais:[
    {id:1,nome:"CINZA SANTA ROSA BRUTO",cl:0,eR:[],eP:[],eT:[],trat:false,tolEntregaDias:2},
    {id:2,nome:"CINZA SANTA ROSA",cl:1,eR:[],eP:["Polir"],eT:[],trat:false,tolEntregaDias:2},
    {id:3,nome:"VERDE UBATUBA",cl:3,eR:["1\u00aa Resina"],eP:["Levigar 1","Polir"],eT:["Tanque Aquecido","Neutraliza\u00e7\u00e3o","Tanque Frio"],trat:true,tolEntregaDias:2},
    {id:4,nome:"BLACK STORM",cl:5,eR:["Tela","Manta","1\u00aa Resina","2\u00aa Resina"],eP:["Levigar 1","Levigar 2","Polir"],eT:["Tanque Aquecido","Neutraliza\u00e7\u00e3o","Tanque Frio"],trat:true,tolEntregaDias:2},
    {id:5,nome:"BIANCO SUPERIORE",cl:6,eR:["Tela","Manta","1\u00aa Resina","2\u00aa Resina","3\u00aa Resina","Impermeabiliza\u00e7\u00e3o"],eP:["Levigar 1","Levigar 2","Levigar 3","Polir"],eT:["Tanque Aquecido","Neutraliza\u00e7\u00e3o","Tanque Frio"],trat:true,tolEntregaDias:2},

var filas={};
function initFilas(){
  filas={};
  BLOCOS.forEach(function(b){
    if(!b.seq)b.seq=[];
    b.seq.forEach(function(et,i){
      if(et.ok)return;var a=ga(et.n);
      if(!filas[a])filas[a]={};if(!filas[a][et.pl])filas[a][et.pl]=[];
      filas[a][et.pl].push({bid:b.id,eidx:i});
    });
  });

  var RAPIDAS=['Polir','Levigar','Lustrar'];
  function grupoEtapa(nome){
    if(RAPIDAS.indexOf(nome)>=0) return 0;
    if(nome==='Escovar') return 1;
    if(nome==='Polir Resinado') return 2;
    return 0;
  }

  // Processar cada área
  Object.keys(filas).forEach(function(a){
    // Ordenar dias cronologicamente
    var dias=Object.keys(filas[a]).sort();
    var ultimaEtapaDodia=null; // rastreia última etapa do dia anterior após ordenação

    dias.forEach(function(d){
      var key=a+'_'+d;
      if(FILA_ORDEM[key]&&FILA_ORDEM[key].length){
        // Ordem manual salva — respeitar
        var ordemSalva=FILA_ORDEM[key];
        filas[a][d].sort(function(x,y){
          var ix=ordemSalva.findIndex(function(o){return o.bid===x.bid&&o.eidx===x.eidx;});
          var iy=ordemSalva.findIndex(function(o){return o.bid===y.bid&&o.eidx===y.eidx;});
          if(ix===-1&&iy===-1)return 0;
          if(ix===-1)return 1;
          if(iy===-1)return -1;
          return ix-iy;
        });
      } else {
        // Sem ordem manual — agrupar explicitamente por tipo de etapa
        var grupoInicial = (a==='politriz'&&ultimaEtapaDodia) ? grupoEtapa(ultimaEtapaDodia) : 0;

        if(a==='politriz'){
          // Separar em grupos
          var grupos=[[],[],[]];
          filas[a][d].forEach(function(x){
            var b2=getB(x.bid);var et2=b2?b2.seq[x.eidx]:null;
            var g=et2?grupoEtapa(et2.n):0;
            grupos[g].push(x);
          });
          // Ordenar dentro de cada grupo por locked + prioridade
          grupos.forEach(function(grp){
            grp.sort(function(x,y){
              var bx=getB(x.bid);var by=getB(y.bid);
              var etx=bx?bx.seq[x.eidx]:null;var ety=by?by.seq[y.eidx]:null;
              var lx=etx&&etx.locked?0:1;var ly=ety&&ety.locked?0:1;
              if(lx!==ly)return lx-ly;
              return PRI_ORD[bx?bx.pri:'normal']-PRI_ORD[by?by.pri:'normal'];
            });
          });
          // Concatenar grupos em ordem circular a partir do grupoInicial
          var resultado=[];
          for(var gi=0;gi<3;gi++){
            var gIdx=(grupoInicial+gi)%3;
            resultado=resultado.concat(grupos[gIdx]);
          }
          filas[a][d]=resultado;
        } else {
          // Outras áreas: locked primeiro, depois prioridade
          filas[a][d].sort(function(x,y){
            var bx=getB(x.bid);var by=getB(y.bid);
            var etx=bx?bx.seq[x.eidx]:null;var ety=by?by.seq[y.eidx]:null;
            var lx=etx&&etx.locked?0:1;var ly=ety&&ety.locked?0:1;
            if(lx!==ly)return lx-ly;
            return PRI_ORD[bx?bx.pri:'normal']-PRI_ORD[by?by.pri:'normal'];
          });
        }
      }

      // Após ordenar, registrar a última etapa deste dia para o próximo
      if(a==='politriz'&&filas[a][d].length){
        var ultimo=filas[a][d][filas[a][d].length-1];
        var bUlt=getB(ultimo.bid);
        if(bUlt&&bUlt.seq[ultimo.eidx]) ultimaEtapaDodia=bUlt.seq[ultimo.eidx].n;
      }
    });
  });
}

function validarFC(bid,eidx,nd){
  var b=getB(bid);if(!b)return{ok:false,bloq:["Bloco n\u00e3o encontrado"],av:[]};
  var et=b.seq[eidx];var area=ga(et.n);var bloq=[];var av=[];
  if(!isU(nd,area))bloq.push("\u274C Dia n\u00e3o \u00fatil para "+CAL[area]);

  // Calcular data mínima baseada na etapa imediatamente anterior
  if(eidx>0){
    var ant=b.seq[eidx-1];
    // Data real da etapa anterior (apontada ou planejada)
    var dAnt=ant.ok&&ant.hist&&ant.hist.length ? ant.hist[ant.hist.length-1].data : ant.pl;
    if(!dAnt){
      bloq.push("\u274C Etapa anterior ("+ant.n+") sem data definida");
    } else {
      // Espera mínima após a etapa anterior
      var espH=getTotalHAnt(ant.n)||0; // duração + espera do tanque
      var diasEsp=espH>0?Math.ceil(espH/24)+1:1;
      var ddMin=fromYMD(dAnt);ddMin.setDate(ddMin.getDate()+diasEsp);
      var dMin=proxU(toYMD(ddMin),area);
      if(nd<dMin){
        bloq.push("\u274C "+et.n+" só pode entrar a partir de "+fd(dMin)+" ("+ant.n+" em "+fd(dAnt)+" + "+diasEsp+"d espera)");
      }
      // Também verificar se nd não é igual a dAnt (mesmo dia que a etapa anterior)
      if(nd===dAnt){
        bloq.push("\u274C Não pode estar no mesmo dia que "+ant.n+" ("+fd(dAnt)+")");
      }
    }
  }

  // Verificar se etapas seguintes não ficam antes desta
  for(var j=eidx+1;j<b.seq.length;j++){
    var prox=b.seq[j];
    if(!prox.ok&&prox.pl&&prox.pl<=nd){
      av.push("\u26A0\uFE0F "+prox.n+" está em "+fd(prox.pl)+" — ficará antes desta etapa");
      break;
    }
  }
  var ch=chapasNoDia(area,nd)+chapasTotal(b);var p=pct(ch,getCAP(area));
  if(p>100)av.push("\u26A0\uFE0F Dia ficar\u00e1 com "+ch+"ch ("+p+"%) \u2014 excede capacidade");
  else if(p>=85)av.push("\uD83D\uDD14 Dia ficar\u00e1 com "+p+"% da capacidade");
  return{ok:bloq.length===0,bloq:bloq,av:av,pct:p};
}
function aplicarFC(bid,eidx,nd,recalc){
  var b=getB(bid);if(!b)return;
  var et=b.seq[eidx];var area=ga(et.n);var dAnt=et.pl;
  // Remove da fila antiga
  if(filas[area]&&filas[area][dAnt]){
    filas[area][dAnt]=filas[area][dAnt].filter(function(x){return!(x.bid===bid&&x.eidx===eidx);});
    if(!filas[area][dAnt].length)delete filas[area][dAnt];
  }
  // Aplica nova data
  et.pl=nd;
  if(!filas[area])filas[area]={};
  if(!filas[area][nd])filas[area][nd]=[];
  filas[area][nd].push({bid:bid,eidx:eidx});
  filas[area][nd].sort(function(a,bx){return PRI_ORD[getB(a.bid).pri]-PRI_ORD[getB(bx.bid).pri];});

  if(recalc){
    var dCursor=nd;
    for(var i=eidx;i<b.seq.length-1;i++){
      var etAtual=b.seq[i];
      var etProx=b.seq[i+1];
      // Travada: mantém data mas avança cursor para depois dela
      if(etProx.locked&&etProx.pl){
        dCursor=etProx.pl;
        continue;
      }
      // Concluída: usa data real como cursor
      if(etProx.ok){
        var dReal=etProx.hist&&etProx.hist.length?etProx.hist[etProx.hist.length-1].data:etProx.pl;
        dCursor=dReal||dCursor;
        continue;
      }
      // Espera mínima da etapa ATUAL antes de entrar na próxima
      var espH=getTotalHAnt(etAtual.n)||0;
      var diasEsp=espH>0?Math.ceil(espH/24):1;
      var ddMin=fromYMD(dCursor);ddMin.setDate(ddMin.getDate()+diasEsp);
      var areaProx=ga(etProx.n);
      var dNova=proxU(toYMD(ddMin),areaProx);
      // Remove da fila antiga
      var dP=etProx.pl;
      if(dP&&filas[areaProx]&&filas[areaProx][dP]){
        filas[areaProx][dP]=filas[areaProx][dP].filter(function(x){return!(x.bid===bid&&x.eidx===i+1);});
        if(!filas[areaProx][dP].length)delete filas[areaProx][dP];
      }
      etProx.pl=dNova;
      if(!filas[areaProx])filas[areaProx]={};
      if(!filas[areaProx][dNova])filas[areaProx][dNova]=[];
      filas[areaProx][dNova].push({bid:bid,eidx:i+1});
      filas[areaProx][dNova].sort(function(a,bx){return PRI_ORD[getB(a.bid).pri]-PRI_ORD[getB(bx.bid).pri];});
      dCursor=dNova;
    }
  }
}

function bda(area){var l=[];BLOCOS.forEach(function(b){if(b.status==="concluido"||b.status==="pausado")return;var idx=etapaAtiva(b);if(idx<0)return;var et=b.seq[idx];if(ga(et.n)!==area)return;l.push({b:b,et:et});});l.sort(function(a,b){if(a.et.pl!==b.et.pl)return a.et.pl<b.et.pl?-1:1;return PRI_ORD[a.b.pri]-PRI_ORD[b.b.pri];});return l;}
function etapasCrit(){var l=[];BLOCOS.forEach(function(b){if(b.status==="concluido"||b.status==="pausado")return;b.seq.forEach(function(et,eidx){if(et.ok)return;var pl=fromYMD(et.pl);pl.setHours(0,0,0,0);var diff=Math.ceil((HOJE-pl)/(1000*3600*24));if(diff>=0)l.push({b:b,et:et,eidx:eidx,diff:diff});});});l.sort(function(a,b){return b.diff-a.diff||PRI_ORD[a.b.pri]-PRI_ORD[b.b.pri];});return l.slice(0,6);}

function seqEditor(ctx,seq,isNovo){
  var seqArr=isNovo?seq:seq.map(function(e){return e.n;});
  var pfx=isNovo?"novo":(ctx+"");
  var html='<div>';
  seqArr.forEach(function(n,i){
    var cor=CA[ga(n)];var cfg=getEspH(n)||0;
    // Status da etapa (só para blocos existentes)
    var etObj=!isNovo&&seq[i]?seq[i]:null;
    var etOk=etObj&&etObj.ok;
    var chF=etObj?(etObj.chF||0):0;
    var chTotal=etObj&&ctx?chapasTotal(getB(ctx)):0;
    var etAtiva=!isNovo&&!etOk&&(i===0||(seq[i-1]&&seq[i-1].ok));
    var etAtrasada=etAtiva&&etObj&&etObj.pl&&etObj.pl<toYMD(HOJE);
    // Badge de status no canto direito
    var statusBadge='';
    if(!isNovo){
      if(etOk) statusBadge='<span style="font-size:13px;">✅</span>';
      else if(etAtrasada) statusBadge='<span style="width:18px;height:18px;border-radius:50%;background:#E24B4A;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;">!</span>';
      else if(etAtiva) statusBadge='<span style="font-size:13px;">⏳</span>';
    }
    // Bloquear reordenação se etapa já foi concluída ou tem apontamento
    var bloqMv=!isNovo&&etObj&&(etOk||(etObj.chF&&etObj.chF>0)||(etObj.hist&&etObj.hist.length>0));
    html+='<div class="step-row" style="border-color:'+cor+'50;background:'+cor+'08;opacity:'+((!isNovo&&!etOk&&!etAtiva)?'.55':'1')+';">'+
      '<div style="display:flex;flex-direction:column;gap:1px;">'+
        '<button class="mv-btn" data-seq-mv data-pfx="'+pfx+'" data-i="'+i+'" data-dir="-1" '+(i===0||bloqMv?"disabled":"")+' title="'+(bloqMv?'Etapa com apontamento — não pode reordenar':'Mover para cima')+'">&#9650;</button>'+
        '<button class="mv-btn" data-seq-mv data-pfx="'+pfx+'" data-i="'+i+'" data-dir="1" '+(i===seqArr.length-1||bloqMv?"disabled":"")+' title="'+(bloqMv?'Etapa com apontamento — não pode reordenar':'Mover para baixo')+'">&#9660;</button>'+
      '</div>'+
      '<div style="width:20px;height:20px;border-radius:50%;background:'+cor+';display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0;">'+(i+1)+'</div>'+
      '<div style="flex:1;"><div style="font-size:11px;font-weight:500;">'+n+'</div><div style="font-size:9px;color:#6b6a65;">'+ga(n)+(cfg>0?' · '+cfg+'h espera':'')+(!isNovo&&chTotal>0?' · '+chF+'/'+chTotal+' ch':'')+'</div></div>'+
      statusBadge+
      '<button class="rmv-btn" data-seq-rem data-pfx="'+pfx+'" data-i="'+i+'" style="padding:2px 7px;font-size:10px;"'+(bloqMv?' disabled title="Etapa com apontamento"':'')+'>\xd7</button>'+
    '</div>';
    if(i<seqArr.length-1)html+='<div style="text-align:center;font-size:9px;color:#9a9890;">↓</div>';
  });
  html+='<div style="margin-top:8px;padding-top:8px;border-top:.5px solid #e0dfd8;">';
  [{lb:"Resina",ets:getEtResina(),cor:"#378ADD"},{lb:"Tratamento",ets:getEtTrat(),cor:"#1D9E75"},{lb:"Politriz",ets:getEtPolitriz(),cor:"#7F77DD"}].forEach(function(g){
    html+='<div style="margin-bottom:5px;"><div style="font-size:9px;color:'+g.cor+';font-weight:600;margin-bottom:2px;">'+g.lb+'</div><div>';
    g.ets.forEach(function(e){var cnt=seqArr.filter(function(x){return x===e;}).length;
      html+='<button class="chip" data-seq-add data-pfx="'+pfx+'" data-et="'+e+'" style="background:'+(cnt>0?g.cor+"18":"#f5f4ed")+';color:'+(cnt>0?g.cor:"#6b6a65")+';border-color:'+(cnt>0?g.cor+"50":"#e0dfd8")+';font-size:12px;padding:4px 10px;">'+(cnt>0?"<b>"+cnt+"\xd7</b> ":"+ ")+e+'</button>';});
    html+='</div></div>';
  });
  html+='</div></div>';return html;
}

window.tornarPadrao = function(bid) {
  var b = getB(bid);
  if (!b || !b.seq || !b.seq.length) { alert("Bloco sem sequência definida."); return; }
  // Encontrar o material correspondente
  var mat = CONFIG.materiais.find(function(m) {
    return m.nome && m.nome.toUpperCase() === (b.mat || "").toUpperCase();
  });
  if (!mat) {
    if (!confirm("Material \"" + b.mat + "\" não encontrado no cadastro. Deseja criar?")) return;
    mat = {id: Date.now(), nome: b.mat, cl: 1, eR: [], eP: [], eT: [], trat: false, seqPadrao: []};
    CONFIG.materiais.push(mat);
  }
  mat.seqPadrao = b.seq.map(function(e) { return e.n; });
  // Atualizar eR, eP, eT com as etapas da sequência
  mat.eR = []; mat.eP = []; mat.eT = [];
  b.seq.forEach(function(et) {
    var n = et.n;
    var area = ga(n);
    var eN = n.normalize ? n.normalize() : n;
    if (area === 'resina' && !mat.eR.some(function(x){return x===n||x.normalize&&x.normalize()===eN;})) mat.eR.push(n);
    else if (area === 'politriz' && !mat.eP.some(function(x){return x===n||x.normalize&&x.normalize()===eN;})) mat.eP.push(n);
    else if (area === 'tratamento' && !mat.eT.some(function(x){return x===n||x.normalize&&x.normalize()===eN;})) mat.eT.push(n);
  });
  // Marcar tratamento se tiver etapas de tratamento
  mat.trat = mat.eT.length > 0;
  render();
  setTimeout(fbSave, 400);
  showToast("⭐ Padrão salvo para " + b.mat + " (" + b.seq.length + " etapas)");
};

window.aplicarPadrao = function() {
  // Sincronizar mat com o DOM antes de buscar
  var sel = document.querySelector('select[onchange*="setBNovoMat"]');
  if (sel && sel.value && sel.value !== '__NOVO__') S.bNovo.mat = sel.value;
  var inputMat = document.querySelector('input[placeholder*="novo material"]');
  if (inputMat && inputMat.value) S.bNovo.mat = inputMat.value.toUpperCase();
  var nomeMat = S.bNovo.mat;
  var mat = CONFIG.materiais.find(function(m){
    return m.nome && m.nome.toUpperCase() === (nomeMat||'').toUpperCase();
  });
  if (!mat) {
    showToast('⚠️ Material não encontrado no cadastro');
    return;
  }
  if (!mat.seqPadrao || !mat.seqPadrao.length) {
    showToast('⚠️ ' + mat.nome + ' não tem sequência padrão — monte manualmente ou cadastre no material');
    return;
  }
  S.bNovo.seq = mat.seqPadrao.slice();
  S.bNovo.mat = mat.nome;
  render();
  showToast('✅ Sequência de ' + mat.nome + ' aplicada!');
};

// Grava dtEntrega no primeiro apontamento de qualquer etapa do bloco

// Quando etapa eidx é concluída (ok=true), recalcula em cascata
// todas as etapas seguintes do bloco respeitando espH de cada uma
function avancarProximaEtapa(b, eidx){
  if(!b||!b.seq)return;
  var et=b.seq[eidx];
  if(!et.ok)return;

  // dCursor = data de partida para calcular a próxima etapa
  // começa a partir do dia apontado da etapa atual + sua espera
  var dCursor=et.pl;

  for(var i=eidx;i<b.seq.length-1;i++){
    var etAtual=b.seq[i];
    var etProx=b.seq[i+1];
    if(etProx.ok)continue; // já concluída, pula

    var espH=getTotalHAnt(etAtual.n)||0;
    var dMin;
    if(espH>=24){
      dMin=toYMD(addD(fromYMD(dCursor),Math.ceil(espH/24)+1));
    } else if(espH>0){
      dMin=toYMD(addD(fromYMD(dCursor),1));
    } else {
      dMin=dCursor; // sem espera, pode ser no mesmo dia
    }

    var areaProx=ga(etProx.n);
    var dNova=proxU(dMin,areaProx);

    // Só move se for avançar — nunca retrocede
    if(dNova>etProx.pl){
      // Remover da fila antiga
      if(filas[areaProx]&&filas[areaProx][etProx.pl]){
        filas[areaProx][etProx.pl]=filas[areaProx][etProx.pl].filter(function(x){return!(x.bid===b.id&&x.eidx===i+1);});
        if(!filas[areaProx][etProx.pl].length)delete filas[areaProx][etProx.pl];
      }
      etProx.pl=dNova;
      // Adicionar na fila nova
      if(!filas[areaProx])filas[areaProx]={};
      if(!filas[areaProx][dNova])filas[areaProx][dNova]=[];
      filas[areaProx][dNova].push({bid:b.id,eidx:i+1});
      filas[areaProx][dNova].sort(function(a,bx){return PRI_ORD[getB(a.bid).pri]-PRI_ORD[getB(bx.bid).pri];});
    }

    // cursor avança para o dia da próxima etapa (que pode ter sido movida ou não)
    dCursor=etProx.pl;
  }
}

// Calcula data de entrega prevista pelas pl (sem considerar apontamentos reais)
// Usada no Comercial quando não há dtEntrega gravada
function calcPrevEntrega(b){
  var dCursor = null;
  for(var i = 0; i < b.seq.length; i++){
    var et = b.seq[i];
    if(!et.ok && et.pl){
      // Usa a pl da primeira etapa pendente como base
      if(!dCursor) dCursor = et.pl;
      else dCursor = et.pl > dCursor ? et.pl : dCursor;
    }
  }
  // Se todas concluídas, usa a pl da última
  if(!dCursor){
    for(var j = b.seq.length-1; j >= 0; j--){
      if(b.seq[j].pl){ dCursor = b.seq[j].pl; break; }
    }
  }
  if(!dCursor) return null;
  var mat = CONFIG.materiais.find(function(m){return m.nome===b.mat;});
  var tol = mat&&mat.tolEntregaDias!=null ? Number(mat.tolEntregaDias) : 2;
  return toYMD(addD(fromYMD(dCursor), tol));
}
function gravarDtEntrega(b, dataApontamento){
  // Recalcula sempre (não só na primeira vez)
  // Ponto de partida: data real do apontamento atual
  var dCursor = dataApontamento || toYMD(HOJE);

  // Percorre a sequência inteira:
  // - Etapas concluídas: usa a data real do último hist (não pl)
  // - Etapas pendentes: projeta a partir do cursor + espH da etapa anterior
  for(var i = 0; i < b.seq.length; i++){
    var et = b.seq[i];
    if(et.ok){
      // Data real = último registro do hist
      var dataReal = (et.hist && et.hist.length) ? et.hist[et.hist.length-1].data : et.pl;
      if(dataReal > dCursor) dCursor = dataReal;
    } else {
      // Pendente: avança pelo total de horas da etapa anterior (duração + espera)
      var espH = i > 0 ? (getTotalHAnt(b.seq[i-1].n) || 0) : 0;
      var dMin;
      if(espH >= 24){ dMin = toYMD(addD(fromYMD(dCursor), Math.ceil(espH/24)+1)); }
      else if(espH > 0){ dMin = toYMD(addD(fromYMD(dCursor), 1)); }
      else { dMin = dCursor; }
      dCursor = proxU(dMin, ga(et.n));
    }
  }

  var mat = CONFIG.materiais.find(function(m){return m.nome===b.mat;});
  var tol = mat&&mat.tolEntregaDias!=null ? Number(mat.tolEntregaDias) : 2;
  b.dtEntrega = toYMD(addD(fromYMD(dCursor), tol));
}

function blocosParaAp(area){
  var hoje=new Date();hoje.setHours(0,0,0,0);
  var lista=[];
  BLOCOS.forEach(function(b){
    if(b.status==="pausado")return;
    var temEtapa=b.seq.some(function(et){return ga(et.n)===area;});
    if(!temEtapa)return;
    var etPend=null;
    for(var i=0;i<b.seq.length;i++){if(ga(b.seq[i].n)===area&&!b.seq[i].ok){etPend={et:b.seq[i],i:i};break;}}
    lista.push({b:b,etPend:etPend});
  });
  lista.sort(function(a,bx){
    if(a.etPend&&!bx.etPend)return -1;
    if(!a.etPend&&bx.etPend)return 1;
    if(a.etPend&&bx.etPend){var da=a.etPend.et.pl||"9999";var db=bx.etPend.et.pl||"9999";if(da!==db)return da<db?-1:1;return PRI_ORD[a.b.pri]-PRI_ORD[bx.b.pri];}

  });
  return lista;
}

function seqEditorMat(m){
  if(!m.seqPadrao)m.seqPadrao=[];
  var seq=m.seqPadrao;

  seq.forEach(function(n,i){
    var cor=CA[ga(n)]||'#888';var cfg=getEspH(n)||0;
    html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;background:'+cor+'08;border:.5px solid '+cor+'30;margin-bottom:4px;">'+
      '<div style="display:flex;flex-direction:column;gap:0px;">'+
        '<button data-mat-mv data-mid="'+m.id+'" data-i="'+i+'" data-dir="-1" class="mv-btn" style="font-size:8px;padding:0 3px;line-height:1.4;" '+(i===0?'disabled':'')+'>▲</button>'+
        '<button data-mat-mv data-mid="'+m.id+'" data-i="'+i+'" data-dir="1" class="mv-btn" style="font-size:8px;padding:0 3px;line-height:1.4;" '+(i===seq.length-1?'disabled':'')+'>▼</button>'+
      '</div>'+
      '<span style="width:20px;height:20px;border-radius:50%;background:'+cor+';display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;">'+(i+1)+'</span>'+
      '<span style="flex:1;font-size:13px;font-weight:500;color:#2d2c28;">'+n+'</span>'+
      '<span style="font-size:10px;color:'+cor+';background:'+cor+'15;padding:2px 7px;border-radius:4px;font-weight:500;">'+ga(n)+(cfg>0?' · '+cfg+'h':'')+'</span>'+
      '<button data-mat-rem data-mid="'+m.id+'" data-i="'+i+'" class="rmv-btn" style="padding:1px 5px;font-size:10px;border-radius:3px;">×</button>'+
    '</div>';
  });
  html+='<div style="margin-top:8px;padding-top:8px;border-top:.5px solid #e0dfd8;">';
  [{lb:"Resina",ets:getEtResina(),cor:"#378ADD"},{lb:"Tratamento",ets:getEtTrat(),cor:"#1D9E75"},{lb:"Politriz",ets:getEtPolitriz(),cor:"#7F77DD"}].forEach(function(g){
    html+='<div style="margin-bottom:5px;"><div style="font-size:9px;color:'+g.cor+';font-weight:600;margin-bottom:2px;">'+g.lb+'</div><div>';
    g.ets.forEach(function(e){
      var cnt=seq.filter(function(x){return x===e;}).length;
      html+='<button data-mat-add data-mid="'+m.id+'" data-et="'+e+'" class="chip" style="background:'+(cnt>0?g.cor+'18':'#f5f4ed')+';color:'+(cnt>0?g.cor:'#6b6a65')+';border-color:'+(cnt>0?g.cor+'50':'#e0dfd8')+';font-size:12px;padding:4px 10px;">'+(cnt>0?'<b>'+cnt+'×</b> ':'+ ')+e+'</button>';
    });
    html+='</div></div>';
  });
  html+='</div></div>';
  return html;
}

window.mvSeqMat=function(mid,i,dir){
  var m=CONFIG.materiais.find(function(x){return x.id===Number(mid);});if(!m||!m.seqPadrao)return;
  var ni=Number(i)+Number(dir);if(ni<0||ni>=m.seqPadrao.length)return;
  var t=m.seqPadrao[ni];m.seqPadrao[ni]=m.seqPadrao[i];m.seqPadrao[i]=t;
  render();setTimeout(fbSave,500);
};
window.remSeqMat=function(mid,i){
  var m=CONFIG.materiais.find(function(x){return x.id===Number(mid);});if(!m||!m.seqPadrao)return;
  m.seqPadrao.splice(Number(i),1);
  // Atualizar eR/eP/eT
  m.eR=m.seqPadrao.filter(function(n){return ga(n)==='resina';}).filter(function(n,i,a){return a.indexOf(n)===i;});
  m.eP=m.seqPadrao.filter(function(n){return ga(n)==='politriz';}).filter(function(n,i,a){return a.indexOf(n)===i;});
  m.eT=m.seqPadrao.filter(function(n){return ga(n)==='tratamento';}).filter(function(n,i,a){return a.indexOf(n)===i;});
  render();setTimeout(fbSave,500);
};
window.addSeqMat=function(mid,et){
  var m=CONFIG.materiais.find(function(x){return x.id===Number(mid);});if(!m)return;
  if(!m.seqPadrao)m.seqPadrao=[];
  m.seqPadrao.push(et);
  // Atualizar eR/eP/eT
  var area=ga(et);
  if(area==='resina'&&(m.eR||[]).indexOf(et)<0){if(!m.eR)m.eR=[];m.eR.push(et);}
  else if(area==='politriz'&&(m.eP||[]).indexOf(et)<0){if(!m.eP)m.eP=[];m.eP.push(et);}
  else if(area==='tratamento'&&(m.eT||[]).indexOf(et)<0){if(!m.eT)m.eT=[];m.eT.push(et);m.trat=true;}
  render();setTimeout(fbSave,500);
};

window.renomearEtCfg=function(area,i,v){
  var lista=area==="resina"?CONFIG.resina.etapas:area==="politriz"?CONFIG.politriz.etapas:CONFIG.tratamento.tanques;
  if(lista[i])lista[i].nome=v;setTimeout(fbSave,800);
};
window.updObsEtCfg=function(area,i,v){
  var lista=area==="resina"?CONFIG.resina.etapas:area==="politriz"?CONFIG.politriz.etapas:CONFIG.tratamento.tanques;
  if(lista[i])lista[i].obs=v;render();setTimeout(fbSave,800);
};
window.moverEtCfg=function(area,i,dir){
  var lista=area==="resina"?CONFIG.resina.etapas:area==="politriz"?CONFIG.politriz.etapas:CONFIG.tratamento.tanques;
  var ni=Number(i)+Number(dir);
  if(ni<0||ni>=lista.length)return;
  var t=lista[ni];lista[ni]=lista[i];lista[i]=t;
  render();setTimeout(fbSave,500);
};

window.updTanque=function(i,k,v){CONFIG.tratamento.tanques[i][k]=['nome','obs'].indexOf(k)>=0?v:(isNaN(v)?v:Number(v));render();setTimeout(fbSave,500);};
window.remTanque=function(i){if(!confirm('Remover esta etapa?'))return;CONFIG.tratamento.tanques.splice(Number(i),1);render();setTimeout(fbSave,500);};
window.toggleTratamentoDay=function(d){
  if(!CONFIG.tratamento.diasAtivos)CONFIG.tratamento.diasAtivos=[0,1,2,3,4,5,6];
  var idx=CONFIG.tratamento.diasAtivos.indexOf(Number(d));
  if(idx>=0)CONFIG.tratamento.diasAtivos.splice(idx,1);
  else CONFIG.tratamento.diasAtivos.push(Number(d));
  DU.tratamento=CONFIG.tratamento.diasAtivos.slice();
  render();setTimeout(fbSave,500);
};

function renderHistorico(){
  var TIPOS={
    'bloco_criado':      {ic:'📦', label:'Bloco criado',        cor:'#378ADD'},
    'apontamento':       {ic:'✏️',  label:'Apontamento',         cor:'#7F77DD'},
    'serrada_entrou':    {ic:'🔷', label:'Entrou na serrada',   cor:'#BA7517'},
    'serrada_reverteu_entrada':{ic:'↩',label:'Reverteu entrada serrada',cor:'#9a9890'},
    'serrada_concluida': {ic:'✅', label:'Serrada concluída',   cor:'#1D9E75'},
    'serrada_reverteu':  {ic:'↩', label:'Serrada revertida',   cor:'#9a9890'},
    'pcp_liberado':      {ic:'🚀', label:'PCP liberado',        cor:'#185FA5'},
    'pcp_reverteu':      {ic:'↩', label:'PCP revertido',       cor:'#9a9890'},
    'apontamento_removido':{ic:'🗑️', label:'Apontamento removido', cor:'#E24B4A'},
  };
  var busca=(S.histFiltroBusca||'').toLowerCase();
  var filtroTipo=S.histFiltroTipo||'todos';
  var filtroData=S.histFiltroData||'';

  // Filtrar e ordenar
  var lista=HISTORICO.slice().sort(function(a,b){return b.ts-a.ts;});
  if(filtroTipo!=='todos') lista=lista.filter(function(h){return h.tipo===filtroTipo;});
  if(busca) lista=lista.filter(function(h){
    return (h.blocoNum||'').toLowerCase().indexOf(busca)>=0||(h.mat||'').toLowerCase().indexOf(busca)>=0||(h.etapa||'').toLowerCase().indexOf(busca)>=0;
  });
  if(filtroData) lista=lista.filter(function(h){return toYMD(new Date(h.ts))===filtroData;});

  // Agrupar por dia
  var grupos={};var dias=[];
  lista.forEach(function(h){
    var dia=toYMD(new Date(h.ts));
    if(!grupos[dia]){grupos[dia]=[];dias.push(dia);}
    grupos[dia].push(h);
  });

  var html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">';
  // Filtros
  html+='<input type="text" placeholder="🔍 Buscar bloco ou material..." value="'+( S.histFiltroBusca||'')+'" oninput="S.histFiltroBusca=this.value;render()" style="flex:1;min-width:200px;padding:6px 10px;font-size:12px;border-radius:6px;border:.5px solid #d0cfc8;">';
  html+='<input type="date" value="'+(S.histFiltroData||'')+'" onchange="S.histFiltroData=this.value;render()" style="font-size:12px;padding:5px 8px;border-radius:6px;border:.5px solid #d0cfc8;">';
  html+='<select onchange="S.histFiltroTipo=this.value;render()" style="font-size:12px;padding:5px 8px;border-radius:6px;border:.5px solid #d0cfc8;">';
  html+='<option value="todos"'+(filtroTipo==='todos'?' selected':'')+'>Todos os eventos</option>';
  Object.keys(TIPOS).forEach(function(k){
    html+='<option value="'+k+'"'+(filtroTipo===k?' selected':'')+'>'+TIPOS[k].ic+' '+TIPOS[k].label+'</option>';
  });
  html+='</select>';
  // Botão exportar CSV
  html+='<button onclick="exportHistoricoCSV()" style="font-size:11px;padding:5px 12px;background:#f5f4ed;border:.5px solid #d0cfc8;border-radius:6px;color:#4a4845;font-weight:600;">⬇ CSV</button>';
  html+='</div>';

  if(!lista.length){
    html+='<div style="text-align:center;padding:60px;color:#9a9890;font-size:14px;">Nenhum evento encontrado</div>';
    return html;
  }

  html+='<div style="font-size:11px;color:#9a9890;margin-bottom:12px;">'+lista.length+' evento(s) encontrado(s)</div>';

  dias.forEach(function(dia){
    var evts=grupos[dia];
    var hoje=toYMD(HOJE);var ontem=toYMD(new Date(HOJE.getTime()-86400000));
    var diaLabel=dia===hoje?'Hoje':dia===ontem?'Ontem':fd(dia);
    html+='<div style="font-size:11px;font-weight:700;color:#6b6a65;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px;">'+diaLabel+'</div>';
    html+='<div style="background:#fff;border:.5px solid #e0dfd8;border-radius:10px;overflow:hidden;">';
    evts.forEach(function(h,idx){
      var t=TIPOS[h.tipo]||{ic:'•',label:h.tipo,cor:'#888'};
      var hora=new Date(h.ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});

window.remHistEvento=function(tsStr){
  var ts=Number(tsStr);
  var idx=HISTORICO.findIndex(function(h){return h.ts===ts;});
  if(idx<0){showToast('⚠️ Evento não encontrado');return;}
  var h=HISTORICO[idx];
  // Se for apontamento, remover também do hist da etapa no bloco
  if(h.tipo==='apontamento'&&h.blocoNum){
    var b=BLOCOS.find(function(x){return String(x.numero)===String(h.blocoNum);});
    if(b){
      var etIdx=b.seq.findIndex(function(e){return e.n===h.etapa;});
      if(etIdx>=0){
        var et=b.seq[etIdx];
        if(et.hist&&et.hist.length){
          // Achar o apontamento pelo número de chapas e data mais próxima
          var apIdx=et.hist.findIndex(function(ap){return ap.ch===h.chapas;});
          if(apIdx>=0){
            et.hist.splice(apIdx,1);
            et.chF=et.hist.reduce(function(a,x){return a+x.ch;},0);
            if(et.chF<chapasTotal(b)){et.ok=false;if(b.status==='concluido')b.status='em_processamento';}
            initFilas();
          }
        }
      }
    }
  }
  HISTORICO.splice(idx,1);
  render();setTimeout(fbSave,500);
  showToast('🗑️ Evento removido');
};
window.exportHistoricoCSV=function(){
  var linhas=[['Data','Hora','Evento','Bloco','Material','Etapa','Área','Chapas'].join(',')];
  HISTORICO.slice().sort(function(a,b){return b.ts-a.ts;}).forEach(function(h){
    var d=new Date(h.ts);

      (h.etapa||'').replace(/,/g,' '),

    ].join(','));

  var blob=new Blob([linhas.join('\n')],{type:'text/csv;charset=utf-8;'});

function capDiaMaxComParada(area,ds){
  var p=PARADAS[ds]&&PARADAS[ds][area]?PARADAS[ds][area]:null;
  if(!p)return null;
  var cfg=area==='resina'?CONFIG.resina:area==='politriz'?CONFIG.politriz:null;
  if(!cfg)return 0;
  var capTotal=Number(cfg.capacidadeDia)||0;
  var tol=(Number(cfg.tolerancia)||0)/100;
  var capMax=Math.round(capTotal*(1+tol));
  var temT2=cfg.turno2Ativo;
  var t1para=p.t1===false;
  var t2para=p.t2===false;
  if(!t1para&&!t2para)return null;
  if(!temT2) return t1para?0:capMax;
  function horasTurno(ini,fim){
    var h1=Number(ini.split(':')[0]),m1=Number(ini.split(':')[1]||0);
    var h2=Number(fim.split(':')[0]),m2=Number(fim.split(':')[1]||0);
    var diff=(h2*60+m2)-(h1*60+m1);
    if(diff<=0)diff+=24*60;
    return diff/60;
  }
  var hT1=horasTurno(cfg.inicioTurno||'06:00',cfg.fimTurno||'18:00');
  var hT2=horasTurno(cfg.inicioTurno2||'18:00',cfg.fimTurno2||'06:00');
  var hTotal=hT1+hT2;
  var hParado=(t1para?hT1:0)+(t2para?hT2:0);
  var propAtivo=(hTotal-hParado)/hTotal;
  return Math.round(capMax*propAtivo);
}

function getDiasRelatorio(area, dataInicio, numDias){
  var resultado=[];
  for(var d=0;d<numDias;d++){
    var ds=toYMD(addD(fromYMD(dataInicio),d));
    var dObj=fromYMD(ds);
    var isFds=dObj.getDay()===0||dObj.getDay()===6;
    var etapas=[];
    BLOCOS.forEach(function(b){
      if(b.status==="concluido")return;
      if(!b.seq)return;
      b.seq.forEach(function(et,i){
        if(ga(et.n)!==area)return;
        if(et.ok)return;
        if(et.pl===ds)etapas.push({b:b,et:et,i:i});
      });
    });
    // Pular fim de semana só se não tiver nada programado
    if(isFds&&etapas.length===0)continue;
    etapas.sort(function(a,bx){
      var op={urgente:0,prioridade:1,normal:2};
      return(op[a.b.pri]||99)-(op[bx.b.pri]||99);
    });
    resultado.push({ds:ds,d:dObj,etapas:etapas,isFds:isFds});
  }
  return resultado;
}

function etapasNoDiaCAL(area,ds,busca,modo){
  var lista=[];
  var busLower=(busca||'').toLowerCase().trim();
  modo=modo||'futuras';
  BLOCOS.forEach(function(b){
    if(b.status==="concluido"&&modo==='futuras')return;
    // Filtro de busca por número ou material
    if(busLower){
      var numMatch=String(b.numero).toLowerCase().indexOf(busLower)>=0;
      var matMatch=b.mat.toLowerCase().indexOf(busLower)>=0;
      if(!numMatch&&!matMatch)return;
    }
    b.seq.forEach(function(et){
      // Filtro por modo
      if(modo==='futuras'&&et.ok)return;
      if(modo==='concluidas'&&!et.ok)return;
      // Filtro por data
      if(et.pl!==ds)return;
      // Filtro por área
      if(area==="todos"){
        var a=ga(et.n);
        if(!a)return;
      } else {
        if(ga(et.n)!==area)return;
      }
      lista.push({b:b,et:et,area:ga(et.n),concluida:et.ok});
    });
  });
  lista.sort(function(a,bx){
    // Concluídas por último
    if(a.concluida!==bx.concluida)return a.concluida?1:-1;
    return{urgente:0,prioridade:1,normal:2}[a.b.pri]-{urgente:0,prioridade:1,normal:2}[bx.b.pri];
  });
  return lista;
}

function buildCalMensal(area,mes,busca,modo){
  var cor=area==="todos"?"#1a1a1a":(CA[area]||"#1a1a1a");

  ["Seg","Ter","Qua","Qui","Sex","S\u00e1b","Dom"].forEach(function(d){
    html+='<div style="text-align:center;font-size:9px;font-weight:700;color:#6b6a65;text-transform:uppercase;letter-spacing:.5px;padding:5px 0;">'+d+'</div>';
  });

    var ets=isMes?etapasNoDiaCAL(area,ds,busca,modo):[];var totalDia=ets.reduce(function(a,it){return a+chapasTotal(it.b);},0);

var PRI_ORD={urgente:0,prioridade:1,normal:2};
window.recalcularTudo=function(){
  if(!confirm("Recalcular todas as datas?\n\nBlocos com 🔒 travado mantêm o dia e a posição."))return;
  // Preservar FILA_ORDEM: blocos locked mantêm posição
  showToast("\u23f3 Recalculando...");
  setTimeout(function(){
    try {

      // ── Configurações por área ──
      function capDiaMax(area){
        var cfg=area==="resina"?CONFIG.resina:area==="politriz"?CONFIG.politriz:area==="tratamento"?CONFIG.tratamento:null;
        if(!cfg)return 9999;
        var cap=Number(cfg.capacidadeDia)||9999;
        var tol=(Number(cfg.tolerancia)||10)/100;
        return Math.round(cap*(1+tol));
      }
      function capSemMax(area){
        var cfg=area==="resina"?CONFIG.resina:area==="politriz"?CONFIG.politriz:area==="tratamento"?CONFIG.tratamento:null;
        if(!cfg)return 9999;
        var dias=(cfg.diasAtivos||[0,1,2,3,4,5,6]).length;
        var cap=Number(cfg.capacidadeDia)||9999;
        var tol=(Number(cfg.tolerancia)||10)/100;
        return Math.round(cap*dias*(1+tol));
      }
      function getDU(area){
        var cfg=area==="resina"?CONFIG.resina:area==="politriz"?CONFIG.politriz:null;
        if(!cfg||!cfg.diasAtivos||!cfg.diasAtivos.length)return [1,2,3,4,5];
        return cfg.diasAtivos;
      }
      function isDU(d,area){
        return getDiasUteis(area).indexOf(d.getDay())>=0;
      }
      function inicioSem(ds){
        var d=fromYMD(ds);
        var dow=d.getDay();
        d.setDate(d.getDate()+(dow===0?-6:1-dow));
        return toYMD(d);
      }
      function nextDU(ds,area){
        var d=fromYMD(ds);
        d.setDate(d.getDate()+1);
        for(var i=0;i<14;i++){if(isDU(d,area))return toYMD(d);d.setDate(d.getDate()+1);}
        return toYMD(d);
      }
      function proxDU(dMin,area){
        var d=fromYMD(dMin);
        var hoje2=new Date(HOJE.getFullYear(),HOJE.getMonth(),HOJE.getDate());
        if(d<hoje2)d=new Date(hoje2);
        for(var i=0;i<365;i++){if(isDU(d,area))return toYMD(d);d.setDate(d.getDate()+1);}
        return dMin;
      }

      // ── Processo do dia da politriz ──
      var procDia=CONFIG.politriz&&CONFIG.politriz.processoDia?CONFIG.politriz.processoDia:{};
      var procDia2=CONFIG.politriz&&CONFIG.politriz.processoDia2?CONFIG.politriz.processoDia2:{};
      var procDia3=CONFIG.politriz&&CONFIG.politriz.processoDia3?CONFIG.politriz.processoDia3:{};
      // Retorna todas as etapas permitidas num dia (próprio + adjacentes, slots 1+2+3)
      function etapasPermitidas(ds,area){
        if(area!=="politriz")return [];
        var d=fromYMD(ds); var dow=d.getDay();
        var dAnt=new Date(d); dAnt.setDate(dAnt.getDate()-1);
        while(!isDU(dAnt,"politriz"))dAnt.setDate(dAnt.getDate()-1);
        var dProx=new Date(d); dProx.setDate(dProx.getDate()+1);
        while(!isDU(dProx,"politriz"))dProx.setDate(dProx.getDate()+1);
        var res=[];
        // Slots do próprio dia
        [procDia,procDia2,procDia3].forEach(function(pd){if(pd[dow])res.push(pd[dow]);});
        // Slots do dia anterior
        [procDia,procDia2,procDia3].forEach(function(pd){if(pd[dAnt.getDay()])res.push(pd[dAnt.getDay()]);});
        // Slots do dia seguinte
        [procDia,procDia2,procDia3].forEach(function(pd){if(pd[dProx.getDay()])res.push(pd[dProx.getDay()]);});
        // Remover duplicatas
        return res.filter(function(v,i,a){return v&&a.indexOf(v)===i;});
      }

      // ── Mapa de ocupação por dia e semana ──
      // Estrutura: {area: {ds: {ch, etapas:[]}}}
      var ocup={};
      function getOD(area,ds){
        if(!ocup[area])ocup[area]={};
        if(!ocup[area][ds])ocup[area][ds]={ch:0,etapas:[],trocasLentas:0};
        return ocup[area][ds];
      }
      function getOS(area,sem){
        if(!ocup[area])ocup[area]={};
        var k='SEM_'+sem;
        if(!ocup[area][k])ocup[area][k]={ch:0};
        return ocup[area][k];
      }

      function podeAlocar(ds,area,nomeEt,ch,bid){
        var capD=capDiaMax(area);
        var capParada=capDiaMaxComParada(area,ds);
        if(capParada!==null) capD=capParada;
        if(capD===0)return false;
        var capS=capSemMax(area);
        var od=getOD(area,ds);
        var os=getOS(area,inicioSem(ds));
        if(od.ch+ch>capD||os.ch+ch>capS)return false;
        if(area==="politriz"){
          var perm=etapasPermitidas(ds,area);
          if(perm.length>0&&perm.indexOf(nomeEt)<0)return false;
          var RAPIDAS=['Polir','Levigar','Lustrar'];
          var od2=getOD(area,ds);
          var etapasNoDia=od2.etapas.map(function(e){return e.nome;});
          var etapasUnicas=etapasNoDia.filter(function(v,i,a){return a.indexOf(v)===i;});
          var temEscovar=etapasUnicas.indexOf('Escovar')>=0;
          var temPolirRes=etapasUnicas.indexOf('Polir Resinado')>=0;
          if(temEscovar && nomeEt==='Polir Resinado') return false;
          if(nomeEt==='Escovar' && temPolirRes) return false;
          var jatemNova=etapasUnicas.indexOf(nomeEt)>=0;
          if(!jatemNova){
            var novasTrocas=0;
            etapasUnicas.forEach(function(etEx){
              var isExRap=RAPIDAS.indexOf(etEx)>=0;
              var isNovaRap=RAPIDAS.indexOf(nomeEt)>=0;
              if(!(isExRap&&isNovaRap)) novasTrocas++;
            });
            var trocasAtuais=od2.trocasLentas||0;
            if(trocasAtuais+novasTrocas>1) return false;
          }
        }
        return true;
      }
      function alocarDia(ds,area,nomeEt,ch,bid){
        var od=getOD(area,ds);
        od.ch+=ch;
        od.etapas.push({nome:nomeEt,bid:bid||null});
        var os=getOS(area,inicioSem(ds));
        os.ch+=ch;
        // Atualizar contador de trocas lentas para Politriz
        if(area==="politriz"){
          var RAPIDAS=['Polir','Levigar','Lustrar'];
          if(!od.trocasLentas) od.trocasLentas=0;
          var etapasAntes=od.etapas.slice(0,-1).map(function(e){return e.nome;});
          var etapasUnicas=etapasAntes.filter(function(v,i,a){return a.indexOf(v)===i;});
          var jatemNova=etapasUnicas.indexOf(nomeEt)>=0;
          if(!jatemNova){
            etapasUnicas.forEach(function(etEx){
              var isExRap=RAPIDAS.indexOf(etEx)>=0;
              var isNovaRap=RAPIDAS.indexOf(nomeEt)>=0;
              if(!(isExRap&&isNovaRap)) od.trocasLentas++;
            });
          }
        }
      }
      function achaSlot(dMin,area,nomeEt,ch,bid){
        var d=proxDU(dMin,area);
        for(var i=0;i<365;i++){
          if(podeAlocar(d,area,nomeEt,ch,bid))return d;
          d=nextDU(d,area);
        }
        return proxDU(dMin,area);
      }

      // Ordenação: urgentes primeiro, depois por maior número de chapas (maximiza capacidade)
      // ── PRÉ-PASSO: Corrigir pl de etapas concluídas para data real do apontamento ──
      BLOCOS.forEach(function(b){
        if(!b||!b.seq)return;
        b.seq.forEach(function(et){
          if(et.ok&&et.hist&&et.hist.length){
            // Usar data do último apontamento como pl real
            var dataReal=et.hist[et.hist.length-1].data;
            if(dataReal) et.pl=dataReal;
          }
        });
      });

      // ── PRÉ-PASSO: etapas locked são intocáveis — só o usuário pode destravar ──

      // ── PASSO 1: Registrar etapas CONCLUÍDAS e TRAVADAS como ocupação fixa ──
      filas={};
      BLOCOS.forEach(function(b){
        if(!b||!b.seq)return;
        var ch=Math.max(1,chapasTotal(b));
        b.seq.forEach(function(et,i){
          var area=ga(et.n);
          var fixo=et.ok||(et.locked&&et.pl);
          if(fixo&&et.pl){
            // Registrar na ocupação — não pode ser movido
            alocarDia(et.pl,area,et.n,ch,b.id);
            // Registrar na fila para exibição
            if(!filas[area])filas[area]={};
            if(!filas[area][et.pl])filas[area][et.pl]=[];
            filas[area][et.pl].push({bid:b.id,eidx:i});
          }
        });
      });

      // ── PASSO 2: Alocar etapas PENDENTES (não concluídas e não travadas) ──
      // Pré-calcular dMin real de cada bloco baseado no histórico de apontamentos
      function calcDMinReal(bl){
        var dAnt=null;
        for(var k=0;k<bl.seq.length;k++){
          var et=bl.seq[k];
          if(et.ok||(et.locked&&et.pl)){
            // Usar data real do apontamento
            if(et.ok&&et.hist&&et.hist.length){
              dAnt=et.hist[et.hist.length-1].data||et.pl||dAnt;
            } else {
              dAnt=et.pl||dAnt;
            }
          } else {
            // Primeira etapa pendente — calcular dMin
            var espHAnt=k>0?getTotalHAnt(bl.seq[k-1].n)||0:0;
            var diasEsp=espHAnt>0?Math.ceil(espHAnt/24)+1:1;
            if(dAnt){
              var dd=fromYMD(dAnt); dd.setDate(dd.getDate()+diasEsp);
              return toYMD(dd);
            }
            return toYMD(HOJE);
          }
        }
        return '9999-99-99';
      }

      var paraAlocar=BLOCOS.filter(function(b){
        if(!b||!b.seq||!b.seq.length)return false;
        if(b.status==="pausado"||b.status==="concluido")return false;
        // Inclui se tiver pelo menos uma etapa pendente não travada
        return b.seq.some(function(et){return !et.ok&&!et.locked;});
      }).sort(function(a,b){
        var pa=(PRI_ORD[a.pri]||2), pb=(PRI_ORD[b.pri]||2);
        if(pa!==pb)return pa-pb;
        // Ordenar por dMin real calculado do histórico
        var dA=calcDMinReal(a), dB=calcDMinReal(b);
        if(dA!==dB) return dA<dB?-1:1;
        // Mesma data: menores primeiro para caber mais blocos no mesmo dia
        return Math.max(1,chapasTotal(a))-Math.max(1,chapasTotal(b));
      });

      paraAlocar.forEach(function(b){
        var ch=Math.max(1,chapasTotal(b));
        var dAnt=null;

        b.seq.forEach(function(et,i){
          var area=ga(et.n);

          // CONCLUÍDA ou TRAVADA: data é fixa
          if(et.ok||(et.locked&&et.pl)){
            // Para concluídas, usar data real do último apontamento como âncora
            if(et.ok&&et.hist&&et.hist.length){
              dAnt=et.hist[et.hist.length-1].data||et.pl||dAnt;
            } else {
              dAnt=et.pl||dAnt;
            }
            return;
          }

          // PENDENTE: calcular data mínima a partir da etapa anterior
          var espHAnt=i>0?getTotalHAnt(b.seq[i-1].n)||0:0;
          var dMin;
          if(dAnt){
            var diasEsp=espHAnt>0?Math.ceil(espHAnt/24)+1:1;
            var dd=fromYMD(dAnt); dd.setDate(dd.getDate()+diasEsp); dMin=toYMD(dd);
          } else {
            dMin=toYMD(HOJE);
          }
          // Nunca usar pl antigo como dMin — pode violar a sequência

          var dNova=achaSlot(dMin,area,et.n,ch,b.id);
          alocarDia(dNova,area,et.n,ch,b.id);

          if(!filas[area])filas[area]={};
          if(!filas[area][dNova])filas[area][dNova]=[];
          filas[area][dNova].push({bid:b.id,eidx:i});

          et.pl=dNova;
          dAnt=dNova;
        });
      });

      // ── PASSO 3: Rebalanceamento com recálculo em cascata ──
      // Para cada dia com espaço, tenta puxar blocos dos próximos 7 dias
      // Ao mover um bloco, recalcula toda a sua sequência futura (cascata)
      var MAX_ITER=8;

      function moverBlocoECascata(b,etIdx,diaAlvo,area){
        var ch=Math.max(1,chapasTotal(b));
        var et=b.seq[etIdx];
        var diaFonte=et.pl;

        // Remover do dia fonte
        var odF=getOD(area,diaFonte);
        odF.ch=Math.max(0,odF.ch-ch);
        odF.etapas=odF.etapas.filter(function(e){return e.bid!==b.id;});
        getOS(area,inicioSem(diaFonte)).ch=Math.max(0,getOS(area,inicioSem(diaFonte)).ch-ch);

        // Alocar no dia alvo
        alocarDia(diaAlvo,area,et.n,ch,b.id);
        et.pl=diaAlvo;

        // Recalcular etapas subsequentes em cascata
        var dAnt=diaAlvo;
        for(var k=etIdx+1;k<b.seq.length;k++){
          var etK=b.seq[k];
          if(etK.ok||(etK.locked&&etK.pl)){
            dAnt=etK.pl||dAnt;
            continue;
          }
          var areaK=ga(etK.n);
          var espHAntK=getTotalHAnt(b.seq[k-1].n)||0;
          var diasEspK=espHAntK>0?Math.ceil(espHAntK/24)+1:1;
          var ddK=fromYMD(dAnt); ddK.setDate(ddK.getDate()+diasEspK);
          var dMinK=proxDU(toYMD(ddK),areaK);

          // Se a data atual já está ok (>= dMin), não precisa mover
          if(etK.pl&&etK.pl>=dMinK){
            dAnt=etK.pl;
            continue;
          }

          // Precisa realocar esta etapa
          var plAntigo=etK.pl;
          var dNova=achaSlot(dMinK,areaK,etK.n,ch,b.id);

          if(plAntigo&&plAntigo!==dNova){
            // Remover do ocup antigo
            var odAntK=getOD(areaK,plAntigo);
            odAntK.ch=Math.max(0,odAntK.ch-ch);
            odAntK.etapas=odAntK.etapas.filter(function(e){return e.bid!==b.id;});
            getOS(areaK,inicioSem(plAntigo)).ch=Math.max(0,getOS(areaK,inicioSem(plAntigo)).ch-ch);
          }

          alocarDia(dNova,areaK,etK.n,ch,b.id);
          etK.pl=dNova;
          dAnt=dNova;
        }
      }

      for(var iter=0;iter<MAX_ITER;iter++){
        var antecipacoes=0;
        var areas=['resina','politriz','tratamento'];

        areas.forEach(function(area){
          // Coletar ocupação por dia
          var diasOcup={};
          paraAlocar.forEach(function(b){
            b.seq.forEach(function(et){
              if(!et.ok&&!et.locked&&ga(et.n)===area&&et.pl){
                diasOcup[et.pl]=(diasOcup[et.pl]||0)+chapasTotal(b);
              }
            });
          });

          var dias=Object.keys(diasOcup).sort();
          if(dias.length<1)return;

          // Expandir para incluir dias úteis vazios entre o primeiro e último dia com ocupação
          // Sem isso, dias completamente vazios nunca são considerados como destino
          var dInicio=dias[0];
          // Expandir dFim para cobrir 45 dias além do último dia com ocupação
          // para que o Passo 3 possa puxar blocos alocados longe no futuro
          var dFimBase=fromYMD(dias[dias.length-1]);
          dFimBase.setDate(dFimBase.getDate()+45);
          var dFim=toYMD(dFimBase);
          var diasAlvo={};
          var dCurP=fromYMD(dInicio);
          var dFimD=fromYMD(dFim);
          while(dCurP<=dFimD){
            var dsP=toYMD(dCurP);
            if(isU(dsP,area)) diasAlvo[dsP]=diasOcup[dsP]||0;
            dCurP=addD(dCurP,1);
          }

          // Ordenar por ocupação crescente (menos cheios primeiro — inclui vazios com 0)
          var diasOrd=Object.keys(diasAlvo).sort(function(a,b){
            return getOD(area,a).ch-getOD(area,b).ch;
          });

          diasOrd.forEach(function(diaAlvo){
            var capD=capDiaMax(area);
            var capParada=capDiaMaxComParada(area,diaAlvo);
            if(capParada!==null) capD=capParada;
            var espaco=capD-getOD(area,diaAlvo).ch;
            if(espaco<=0)return;

            // Buscar nos próximos 45 dias (para alcançar blocos alocados longe)
            var limiteData=fromYMD(diaAlvo);
            limiteData.setDate(limiteData.getDate()+45);
            var limiteDStr=toYMD(limiteData);

            var dFonte=nextDU(diaAlvo,area);
            while(dFonte<=limiteDStr&&espaco>0){
              if(!diasOcup[dFonte]){dFonte=nextDU(dFonte,area);continue;}

              // Blocos neste dia, menores primeiro
              var blocosNoDia=paraAlocar.filter(function(b){
                return b.seq.some(function(et){
                  return !et.ok&&!et.locked&&ga(et.n)===area&&et.pl===dFonte;
                });
              }).sort(function(a,b){return chapasTotal(a)-chapasTotal(b);});

              blocosNoDia.forEach(function(b){
                if(espaco<=0)return;
                var ch=Math.max(1,chapasTotal(b));
                if(ch>espaco)return;

                var etIdx=-1;
                b.seq.forEach(function(et,i){
                  if(!et.ok&&!et.locked&&ga(et.n)===area&&et.pl===dFonte) etIdx=i;
                });
                if(etIdx<0)return;

                // Calcular dMin desta etapa
                var dAntCalc=null;
                for(var k=0;k<etIdx;k++){
                  var etK=b.seq[k];
                  if(etK.ok||(etK.locked&&etK.pl)){
                    dAntCalc=etK.ok&&etK.hist&&etK.hist.length?etK.hist[etK.hist.length-1].data:etK.pl||dAntCalc;
                  } else {
                    dAntCalc=etK.pl||dAntCalc;
                  }
                }
                var espHAnt=etIdx>0?getTotalHAnt(b.seq[etIdx-1].n)||0:0;
                var diasEsp=espHAnt>0?Math.ceil(espHAnt/24)+1:1;
                var ddMin=dAntCalc?fromYMD(dAntCalc):new Date(HOJE);
                if(dAntCalc) ddMin.setDate(ddMin.getDate()+diasEsp);
                var dMin=proxDU(toYMD(ddMin),area);

                if(diaAlvo>=dMin&&podeAlocar(diaAlvo,area,b.seq[etIdx].n,ch,b.id)){
                  moverBlocoECascata(b,etIdx,diaAlvo,area);
                  espaco-=ch;
                  antecipacoes++;
                  diasOcup[diaAlvo]=(diasOcup[diaAlvo]||0)+ch;
                  diasOcup[dFonte]=Math.max(0,(diasOcup[dFonte]||0)-ch);
                }
              });

              dFonte=nextDU(dFonte,area);
            }
          });
        });

        if(antecipacoes===0) break;
      }

      // Salvar dtEntregaBase na primeira vez
      BLOCOS.forEach(function(b){
        if(!b||!b.seq||!b.seq.length)return;
        var ultPl=null;
        for(var i=b.seq.length-1;i>=0;i--){if(b.seq[i].pl){ultPl=b.seq[i].pl;break;}}
        if(!ultPl)return;
        if(!b.dtEntregaBase){b.dtEntregaBase=ultPl;}
        var dBase=fromYMD(b.dtEntregaBase);
        var dAtual=fromYMD(ultPl);
        b.diasAtrasoEntrega=dAtual>dBase?Math.ceil((dAtual-dBase)/(1000*3600*24)):0;
      });

      initFilas();
      render();
      setTimeout(fbSave,600);
      showToast("\u2705 Recalculado! "+paraAlocar.length+" blocos redistribu\u00eddos.");
    } catch(e){
      console.error("Erro recalcular:",e);
      showToast("\u26a0\ufe0f Erro: "+e.message);
    }
  },100);
};

// ═══ COMPRAS ═══
function fmtBRL(v){return"R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
function valorBRL(c){var v=(c.valorM3||0)*11;var vB=c.moeda==="USD"?v*(c.cambio||5.8):v;var fr=(c.fretePorBloco||0)*(c.moedaFrete==="USD"?(c.cambio||5.8):1);return vB+fr;}
window.setCompMes=function(v){S.compMes=v;render();};
window.setCompFiltro=function(v){S.compFiltroMercado=v;};window.aplicarCompFiltro=function(){render();};;
window.addMercado=function(){var nm=prompt('Nome do novo mercado:');if(!nm||!nm.trim())return;nm=nm.trim();if(!CONFIG.mercados)CONFIG.mercados=getMercados().slice();if(CONFIG.mercados.indexOf(nm)>=0){alert('Já existe!');return;}CONFIG.mercados.push(nm);render();setTimeout(fbSave,400);showToast('✅ Mercado '+nm+' adicionado!');};
window.renomearMercado=function(i){var ms=getMercados();var novo=prompt('Novo nome para "'+ms[i]+'":', ms[i]);if(!novo||!novo.trim()||novo===ms[i])return;if(!CONFIG.mercados)CONFIG.mercados=ms.slice();CONFIG.mercados[i]=novo.trim();render();setTimeout(fbSave,400);};
window.removerMercado=function(i){var ms=getMercados();if(!confirm('Remover "'+ms[i]+'"?'))return;if(!CONFIG.mercados)CONFIG.mercados=ms.slice();CONFIG.mercados.splice(i,1);render();setTimeout(fbSave,400);};
window.toggleCompNovo=function(){S.compNovo=!S.compNovo;render();};
window.setCompFormNovoMat=function(v){S.compForm.material=v.toUpperCase();  };
window.setCompFormVal=function(k,v){S.compForm[k]=isNaN(v)||["material","classe","espessura","mercado","moeda","moedaFrete"].indexOf(k)>=0?v:Number(v);};
window.setCompFormSel=function(k,v){
  if(k==='material'&&v==='__NOVO__'){S.compForm.material='__NOVO__';render();return;}
  S.compForm[k]=v;render();
};
window.saveComp=function(){var f=S.compForm;if(!f.material.trim()){alert("Informe o material.");return;}COMPRAS.push({id:Date.now(),material:f.material.trim(),classe:f.classe,espessura:f.espessura,mercado:f.mercado,qtdBlocos:Number(f.qtdBlocos)||1,moeda:f.moeda,valorM3:Number(f.valorM3)||0,cambio:Number(f.cambio)||5.8,fretePorBloco:Number(f.fretePorBloco)||0,moedaFrete:f.moedaFrete||"BRL",mes:S.compMes,chegaram:0,dispPCP:false,obs:""});S.compNovo=false;render();setTimeout(fbSave,400);};
window.remComp=function(id){if(!confirm("Remover?"))return;COMPRAS=COMPRAS.filter(function(c){return c.id!==Number(id);});render();setTimeout(fbSave,400);};
window.updCompChegou=function(id,v){
  var c=COMPRAS.find(function(x){return x.id===Number(id);});
  if(!c)return;
  var anterior=c.chegaram||0;
  c.chegaram=Math.max(0,Math.min(c.qtdBlocos,Number(v)||0));
  // Se aumentou, gerar blocos no estoque automaticamente
  var novos=c.chegaram-anterior;
  for(var i=0;i<novos;i++){
    ESTOQUE.push({
      id:Date.now()+i,
      numero:'',  // operador vai preencher depois
      material:c.material,
      classe:Number(c.classe)||1,
      mercado:c.mercado||'Obra',
      comp:0,alt:0,larg:0,vol:0,
      status:'estoque',
      dtEntrada:toYMD(HOJE),
      compraId:c.id
    });
  }
  if(novos>0)showToast('✅ '+novos+' bloco(s) adicionado(s) ao Estoque');

window.serAddBloco=function(){
  var id=Number(S.serAddId||0);if(!id){alert("Selecione um bloco.");return;}
  if(FILA_SERRADA.find(function(x){return x.estoqueId===id;})){alert("Bloco já na fila.");return;}
  var b=ESTOQUE.find(function(x){return x.id===id;});
  if(!b){alert("Bloco não encontrado.");return;}
  b.status='serrada';
  var ef=S.serEstForm||{};
  var ch2=Number(ef.chapas2cm)||0;
  var ch3=Number(ef.chapas3cm)||0;
  var esp=(ch2>0&&ch3>0)?'ambos':(ch3>0?'3cm':'2cm');
  FILA_SERRADA.push({
    bid:null, estoqueId:id,
    numero:b.numero, material:b.material,
    obs:S.serAddObs||"", espessura:esp,
    chapas2cm:ch2, chapas3cm:ch3,
    chegouSerrada:false, concluidoSerrada:false, dispPCP:false,
    dtEntrada:toYMD(HOJE), dtSaida:null
  });
  S.serAddId=null;S.serAddObs="";S.serEstForm={chapas2cm:0,chapas3cm:0};render();setTimeout(fbSave,400);
};

window.serAddManual=function(){
  var f=S.serManualForm;
  if(!f.numero.trim()){alert('Informe o número do bloco.');return;}
  if(!f.material){alert('Selecione o material.');return;}
  // Se material não existe no cadastro, adicionar automaticamente
  var matExisteSer=CONFIG.materiais.some(function(m){return m.nome.trim().toLowerCase()===f.material.trim().toLowerCase();});
  if(f.material&&!matExisteSer){
    CONFIG.materiais.push({id:Date.now(),nome:f.material.trim().toUpperCase(),cl:1,eR:[],eP:[],eT:[],trat:false,seqPadrao:[]});
    showToast('\u2705 Material '+f.material+' adicionado ao cadastro!');
  }
  if(FILA_SERRADA.find(function(x){return x.numero===f.numero.trim();})){alert('Bloco #'+f.numero+' já está na fila.');return;}
  FILA_SERRADA.push({
    bid:null, estoqueId:null,
    numero:f.numero.trim(),
    material:f.material,
    obs:S.serAddObs||'',
    espessura: (f.chapas2cm>0&&f.chapas3cm>0)?'ambos':(f.chapas3cm>0?'3cm':'2cm'),
    chapas2cm:f.chapas2cm||0,
    chapas3cm:f.chapas3cm||0,
    chegouSerrada:false, concluidoSerrada:false, dispPCP:false,
    dtEntrada:toYMD(HOJE), dtSaida:null,
    manual:true
  });
  S.serManualForm={numero:'',material:'',chapas2cm:0,chapas3cm:0};

window.serReverter=function(i){
  var item=FILA_SERRADA[Number(i)];
  if(!item)return;
  if(item.concluidoSerrada){alert('Serrada já concluída. Não é possível reverter.');return;}
  if(!confirm('Reverter bloco #'+item.numero+' para o Estoque?'))return;
  // Restaurar status no estoque
  if(item.estoqueId){
    var eb=ESTOQUE.find(function(x){return x.id===item.estoqueId;});
    if(eb)eb.status='estoque';
  }
  FILA_SERRADA.splice(Number(i),1);
  render();setTimeout(fbSave,400);
  showToast('↩ Bloco #'+item.numero+' retornado ao Estoque');
};

window.serToggleConcluido=function(i){
  var item=FILA_SERRADA[Number(i)];if(!item)return;
  item.concluidoSerrada=!item.concluidoSerrada;
  logEvento(item.concluidoSerrada?'serrada_concluida':'serrada_reverteu',{blocoNum:item.numero,mat:item.material});
  if(item.concluidoSerrada){
    item.dtSaida=toYMD(HOJE);
    // Marcar no estoque como 'serrado'
    if(item.estoqueId){
      var eb=ESTOQUE.find(function(x){return x.id===item.estoqueId;});
      if(eb)eb.status='serrado';
    }
  } else {
    item.dtSaida=null;
    // Reverter para 'serrada'
    if(item.estoqueId){
      var eb=ESTOQUE.find(function(x){return x.id===item.estoqueId;});
      if(eb)eb.status='serrada';
    }
  }
  render();setTimeout(fbSave,400);
};
window.serToggleDisp=function(i){
  var item=FILA_SERRADA[Number(i)];if(!item)return;

    BLOCOS.push({
      id:id,
      numero:item.numero||('SER-'+id),
      mat:item.material||'',
      chapas2cm:item.chapas2cm||0,
      chapas3cm:item.chapas3cm||0,
      op:'',pri:'normal',status:'fila',seq:[],

    });

    }
    showToast('✅ Bloco #'+item.numero+' enviado para Beneficiamento!');

};

}

// ═══ ESTOQUE DE BLOCOS ═══
window.toggleEstNovo=function(){S.estNovo=!S.estNovo;render();};
window.setEstFiltro=function(v){S.estFiltro=v;};window.aplicarEstFiltro=function(){render();};;
window.setEstForm=function(k,v){
  S.estForm[k]=(['numero','material'].indexOf(k)>=0)?v:(isNaN(v)?v:Number(v));
  if(['numero','material'].indexOf(k)>=0)return; // não re-render ao digitar texto
  render();
};
window.salvarEstBloco=function(){
  var f=S.estForm;
  if(!f.numero.trim()){alert('Informe o número do bloco.');return;}
  if(!f.material.trim()){alert('Informe o material.');return;}
  var vol=(f.comp||0)*(f.alt||0)*(f.larg||0);
  ESTOQUE.push({
    id:Date.now(),
    numero:f.numero.trim(),
    material:f.material.trim().toUpperCase(),
    classe:Number(f.classe)||1,
    mercado:f.mercado||'Obra',
    comp:Number(f.comp)||0,
    alt:Number(f.alt)||0,
    larg:Number(f.larg)||0,
    vol:Math.round(vol*1000)/1000,
    status:'estoque', // estoque | serrada | beneficiamento
    dtEntrada:toYMD(HOJE)
  });
  S.estNovo=false;
  S.estForm={numero:'',material:'',classe:1,mercado:'Obra',comp:0,alt:0,larg:0};
  render();setTimeout(fbSave,400);
  showToast('✅ Bloco #'+f.numero+' adicionado ao estoque');
};
window.updEst=function(id,k,v){
  var b=ESTOQUE.find(function(x){return x.id===Number(id);});
  if(!b)return;
  b[k]=(['numero'].indexOf(k)>=0)?String(v).trim():Number(v)||0;
  if(['comp','alt','larg'].indexOf(k)>=0)b.vol=Math.round(b.comp*b.alt*b.larg*1000)/1000;
  setTimeout(fbSave,600);
};
window.remEstBloco=function(id){
  if(!confirm('Remover bloco do estoque?'))return;
  ESTOQUE=ESTOQUE.filter(function(b){return b.id!==Number(id);});
  render();setTimeout(fbSave,400);
};
window.moverParaSerrada=function(id){
  var b=ESTOQUE.find(function(x){return x.id===Number(id);});
  if(!b)return;
  b.status='serrada';
  // Adicionar na fila de serrada
  if(!FILA_SERRADA.find(function(x){return x.estoqueId===id;})){
    FILA_SERRADA.push({
      bid:null, estoqueId:Number(id),
      numero:b.numero, material:b.material,
      obs:'', espessura:'2cm',
      chapas2cm:0, chapas3cm:0,
      chegouSerrada:false, concluidoSerrada:false, dispPCP:false,
      dtEntrada:toYMD(HOJE), dtSaida:null
    });
  }
  render();setTimeout(fbSave,400);
  showToast('✅ Bloco #'+b.numero+' enviado para Serrada');
};

    [1,2,3,4,5,6].forEach(function(c){html+='<option value="'+c+'"'+(f.classe==c?' selected':'')+'>Cl. '+c+'</option>';});
